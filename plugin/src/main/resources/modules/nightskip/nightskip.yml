# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
enabled: true
# 2026-10-25: доля игроков, которые должны спать, чтобы ночь пошла быстрее. 50 — половина тех, кто в игре
# и не отошёл (спящий игрок «отошедшим» не считается). Меньше — ночь ускоряет даже одиночка, больше —
# нужно почти согласие всех.
required-percent: 50
# Во сколько раз ночь идёт быстрее обычного, пока спят достаточно игроков. 30 — ночь (~10 минут) проходит
# примерно за 20 секунд; шаг делается каждый тик, поэтому небо движется плавно, а последний шаг заканчивается ровно утром.
max-multiplier: 30
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
