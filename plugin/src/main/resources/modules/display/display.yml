# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
# Модуль «Теги и суффиксы» (добавлен 2026-10-23): каждый игрок сам выбирает, показывать ли тег клана и
# суффикс в чате, в списке игроков и над головой, и скрывать ли чужие. Выбор хранится у игрока и действует
# на LoveChat через контракт LoveCore. По умолчанию модуль включён и всё показано, поэтому сервер выглядит
# как раньше, пока игрок сам ничего не отключил. Выключение модуля возвращает показ всем.
enabled: true
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
