# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
# /display управляет собственными кланом и пометкой игрока отдельно для чата, TAB и имени над головой.
# Отключённый элемент не виден никому, включая владельца. Отдельное право не требуется.
# Выбор хранится в SQLite и действует в LoveChat через сервис DisplayPrefs из LoveCore.
# Старые флаги просмотра чужих подписей сохранены для совместимости API, но больше не влияют на показ.
# По умолчанию всё показано; отключение модуля возвращает показ всем.
enabled: true
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
