# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
# Модуль «Теги и пометки» (добавлен 2026-10-23): каждый игрок сам выбирает, показывать ли тег клана и
# пометки в чате, в списке игроков и над головой у других игроков. Выбор хранится у игрока и действует
# на LoveChat через контракт LoveCore.
# 2026-10-23: меню и команда /display меняют только то, что видит сам игрок. Скрыть собственный тег у всех
# может лишь тот, у кого есть право loveessential.display.own (по умолчанию op): иначе игрок, скрывший тег
# у всех, сам не заметил бы этого и не знал бы, как вернуть его обратно. По умолчанию модуль включён и всё показано, поэтому сервер выглядит
# как раньше, пока игрок сам ничего не отключил. Выключение модуля возвращает показ всем.
enabled: true
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
