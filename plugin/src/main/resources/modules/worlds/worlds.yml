# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
enabled: true
max-worlds: 64
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
# Глобальный доступ к измерениям и мирам (включая ванильные, без импорта в LE).
# enabled: false закрывает все входы и переводит игроков в запасной мир.
# Это не удаляет папки и не меняет параметры загрузки измерений самого сервера.
entry:
  nether:
    enabled: true
    portals: true
  end:
    enabled: true
    portals: true
  # Дополнительные миры, закрытые по имени. Нельзя закрыть все доступные миры.
  disabled-worlds: []
  # Пусто — первый разрешённый обычный мир, затем любой доступный.
  # Явно указанный запасной мир должен быть загружен и разрешён.
  fallback-world: ''
