# Настройки модуля. Тексты находятся в lang.yml.
enabled: true
timeout-seconds: 300
kick-after-seconds: 0

# Пустые списки не ограничивают. Запрет важнее разрешения; required — все состояния, allowed — любое.
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
