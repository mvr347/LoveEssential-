enabled: true
max-portals: 128
max-volume: 32768
default-cooldown-seconds: 3
disabled-worlds: []
# Command roots without slash; only administrators configure portal actions.
allowed-player-commands: [lovecontracts, loveadaptation, loveactivities, loveduels, lovebehavior, lovehunt]
allowed-console-commands: []
particles:
  refresh-ticks: 6
  view-distance: 32.0
  per-player-budget: 256
  per-portal-budget: 64
  creation-ticks: 60

# Пустые списки не ограничивают. Запрет важнее разрешения; required — все состояния, allowed — любое.
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []

# Тексты кнопок задаются ключами lang.yml; оформление не меняет права и обработчики.
gui:
  menus: {}
