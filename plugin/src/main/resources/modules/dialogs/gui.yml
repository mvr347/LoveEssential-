texts:
  windows:
    title: <gold>Диалоговые окна
    help: <gray>Выберите окно. Администратор может изменить его, игрок — открыть доступное.
    entry: <gold><id>
    create: <gold>Новое диалоговое окно
    create-help: <gray>Введите ID из строчных латинских букв, цифр, _ и -.
    id: <gold>ID окна
    default-title: <gold>Окно королевства
    default-body: <gray>Текст диалогового окна.
    edit: <gold>Редактор диалогового окна
    edit-help: <gray>Заголовок и текст поддерживают MiniMessage и плейсхолдеры LoveEssential. Все тексты сохраняются в lang.yml.
    heading: <gold>Заголовок
    body: <gold>Текст
    answers: <gold>Кнопки ответов
    answers-help: <gray>Откройте кнопку для изменения подписи, права и действия.
    add-answer: <green>Добавить ответ
    answer: <gold>Настройка ответа
    answer-help: <gray>Выберите действие. Для сообщения — MiniMessage; для диалога/мира — ID. В параметрах можно использовать ${имя_поля}. Команды
      выполняются с обычными правами игрока.
    label: <gold>Подпись
    preview: <gold>Предпросмотр
    delete-confirm: <yellow>Удалить это диалоговое окно?
    inputs: <gold>Поля ввода
    inputs-help: <gray>Укажите ID поля для добавления, изменения или удаления. В параметрах действий доступна подстановка ${ID}.
    input-id: <gold>ID поля (a-z, 0-9, _)
    initial: <gold>Начальное значение
    limit: <red>Достигнут лимит окон, полей или ответов.
    add-input: <green>Добавить или заменить поле
    remove-input: <red>Удалить поле по ID
    usage: <yellow>/le dialog [list|create|edit|open|delete] [ID]
    motd-title: <gold>Редактор MOTD сервера
    motd-help: <gray>Две строки описания в списке серверов. Поддерживается MiniMessage. Предпросмотр не публикует изменения; «Сохранить» применяет
      их.
    motd-first: <gold>Первая строка
    motd-second: <gold>Вторая строка
    input-limit: <gold>Максимум символов (1–2048)
