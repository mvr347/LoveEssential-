# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
enabled: true
click-to-sit: true
ride-range: 4.0
player-riding-enabled: true
# 2026-11-09: сколько игроков может быть в одной башне /ride (носитель + все, кто сидит друг на друге). Раньше сесть можно
# было только на свободного игрока, и башню из трёх нельзя было собрать вообще. Предел нужен, чтобы башня не росла
# бесконечно: каждый уровень - ещё один игрок, который едет по чужим приватам и тянет за собой всю цепочку.
ride-max-stack: 4
# 2026-10-22: на ком нельзя ехать. Летающие и водные существа дают бесплатный полёт мимо границ
# приватов (всадник вне зоны досягаемости патруля) или топят всадника на суше, поэтому они
# отсечены списком, а не проверкой «на земле ли моб»: список виден админу и правится без кода.
ride-denied-types:
- HAPPY_GHAST
- GHAST
- PHANTOM
- BAT
- ALLAY
- VEX
- PARROT
- BEE
- BREEZE
- BLAZE
- WITHER
- ENDER_DRAGON
- GUARDIAN
- ELDER_GUARDIAN
- SQUID
- GLOW_SQUID
- DOLPHIN
- AXOLOTL
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
