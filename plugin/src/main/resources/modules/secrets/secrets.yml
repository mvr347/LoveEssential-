# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
# Модуль «Книга тайн» (добавлен 2026-10-30): список пасхалок, которые игрок уже нашёл. Плагины зовут
# сервис SecretBook из LoveCore в момент находки, а каталог (названия, подсказки, значки) ведёт этот
# файл, поэтому новую тайну можно добавить, не пересобирая плагин-источник. Найденное хранится в
# SQLite отдельно у каждого игрока. Неизвестный идентификатор из другого плагина игнорируется.
# Награды за находку модуль не выдаёт: событие SecretDiscoveredEvent позволяет другим плагинам
# сделать это самим (например, выдать титул).
enabled: true
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
# Каталог тайн. Порядок в файле — порядок в книге. name — как называется после находки,
# hint — намёк до неё, description — что нужно было сделать, icon — предмет из Material.
catalog:
  toast:
    icon: GLASS_BOTTLE
    name: Чин-чин
    hint: Бокалы любят компанию.
    description: Вы чокнулись с другим игроком, присев и кликнув по нему с напитком в руке.
  legendary_aging:
    icon: BARREL
    name: Выдержан годами
    hint: Время — лучший пивовар.
    description: Вы достали из бочки напиток, который пролежал там целый игровой год.
  perfectionists:
    icon: CHEST
    name: Перфекционисты
    hint: Порядок в сундуке — порядок в голове.
    description: Вы закрыли сундук клана, в котором все занятые ячейки забиты одним предметом по 64 штуки.
  same_for_same:
    icon: EMERALD
    name: Бессмысленно, но честно
    hint: Иногда обмен — просто ритуал.
    description: Вы обменяли предметы на точно такие же.
  anniversary:
    icon: CAKE
    name: С годовщиной!
    hint: Некоторые даты стоит отмечать.
    description: Вы зашли на сервер в годовщину своей регистрации.
  nine_lives:
    icon: STRING
    name: Девять жизней
    hint: Говорят, у кошек их девять.
    description: Вас подняли три раза за одну жизнь.
  debt_repaid:
    icon: GOLD_INGOT
    name: Долг платежом красен
    hint: Добро возвращается.
    description: Вас поднял тот, кого вы сами когда-то поднимали.
  western:
    icon: CROSSBOW
    name: Как в вестерне
    hint: В хорошей дуэли иногда падают оба.
    description: Вы и соперник упали в дуэли одновременно.
