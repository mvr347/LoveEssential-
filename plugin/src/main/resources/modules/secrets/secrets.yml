# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
# Модуль «Книга тайн» (добавлен 2026-10-30): пасхалки, которые игрок уже нашёл. Плагины зовут сервис
# SecretBook из LoveCore в момент находки. С 2026-11-10 тайны влиты в общие достижения: каждая тайна это
# скрытая ачивка категории secret с идентификатором secret_<id> (каталог в modules/achievements/achievements.yml),
# а /secrets открывает достижения на этой категории. Этот файл остаётся только как выключатель и политика доступа
# команды /secrets и сервиса SecretBook. Старый список найденного переносится в достижения один раз, при первой
# загрузке прогресса игрока. Неизвестный идентификатор из другого плагина игнорируется.
enabled: true
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
