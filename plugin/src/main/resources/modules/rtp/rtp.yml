# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
# Модуль «Случайный телепорт» (добавлен 2026-10-22): /rtp переносит игрока в случайную безопасную
# точку его мира, по образцу BetterRTP. Значения ниже выбраны на 2026-10-22; у каждого указано, почему.
enabled: true
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
# Разогрев перед переносом, секунды. 5 с показывают, что перенос намеренный, и не дают вывести
# себя из боя мгновенным прыжком. Больше 10 с игроки начинают считать команду сломанной.
warmup-seconds: 5
# Сдвиг, блоки, который отменяет разогрев. 0.5 блока переживает отталкивание и сползание по склону,
# а заметный шаг уже отменяет перенос: разогрев задуман как стояние на месте, а не как уход из боя.
cancel-distance: 0.5
# Защита от урона падением и удушьем после переноса, секунды. Нужна, чтобы успеть осмотреться в
# незнакомом месте и не погибнуть от падения или удушья раньше, чем появится возможность выбраться.
# Остальной урон (мобы, игроки) проходит как обычно. Дольше 10 с защита уже мешала бы игре.
invulnerable-seconds: 5
# Кулдаун между успешными переносами, секунды. 300 с (5 мин) не дают использовать перенос как
# бесплатный способ обойти карту, но не мешают сменить место после боя.
cooldown-seconds: 300
# Группы кулдауна: право loveessential.rtp.cooldown.<группа> даёт время из этого списка.
# Берётся наименьшее из доступных значений, но не больше cooldown-seconds. Пример: vip: 120
cooldown-groups: {}
# Плата в монетах LoveEconomy. Списывается только после того, как игрок реально оказался в новой
# точке: если перенос не состоялся, монеты не тратятся. 0 — бесплатно.
cost: 0
# Отступ от границы мира, блоки. У самого края границы чанки и рельеф обычно не годятся, а 16 блоков
# отделяют точку от него с запасом, который не сужает мир заметно.
border-margin: 16
# Соответствие миров: из какого мира куда переносить. Например, из Незера — в обычный мир:
# world-map: {world_nether: world}. Пустой список — переносить внутри того же мира.
world-map: {}
# Блоки, которые не могут быть ни под ногами, ни в ногах, ни в голове у точки. Вода — чтобы не
# оказаться в озере или океане; лава и магма — горят и вредят; кактус — ранит; листва — верхушки
# деревьев не дают нормально встать, и игрок повисает в кроне.
blacklist-blocks:
- WATER
- LAVA
- MAGMA_BLOCK
- CACTUS
- POWDER_SNOW
- OAK_LEAVES
- SPRUCE_LEAVES
- BIRCH_LEAVES
- JUNGLE_LEAVES
- ACACIA_LEAVES
- DARK_OAK_LEAVES
- MANGROVE_LEAVES
- CHERRY_LEAVES
- PALE_OAK_LEAVES
- AZALEA_LEAVES
- FLOWERING_AZALEA_LEAVES
# Биомы, в которых точки не выбираются. Океаны исключены целиком: там поверхность почти всегда вода,
# а поиск суши на глубине отнимает время у разогрева.
blacklist-biomes:
- ocean
- deep_ocean
- cold_ocean
- deep_cold_ocean
- frozen_ocean
- deep_frozen_ocean
- lukewarm_ocean
- deep_lukewarm_ocean
- warm_ocean
# Заранее найденные точки. Игрок берёт готовую точку, поэтому не ждёт загрузки чанков.
queue:
  # Точек на мир. 10 хватает на несколько переносов подряд, а запас не держит много чанков.
  size: 10
  # Тиков между добавлениями одной точки. 20 тиков (1 с) — одна загрузка чанка в секунду, без
  # заметной просадки TPS; когда запас полон, поиск не идёт вовсе.
  interval-ticks: 20
# 2026-10-25: мир, которого нет в worlds ниже, но он обычный (не Незер и не Энд), берёт эти значения: /rtp в
# любом таком мире (например, spawn) переносит внутри него самого. Незер и Энд без своей записи отказывают:
# у них другая высота. Чтобы в мире /rtp не работал, добавьте его в worlds с enabled: false.
default-world:
  enabled: true
  center-on-border: true
  center-x: 0
  center-z: 0
  min-radius: 200
  max-radius: 2000
  shape: circle
  max-attempts: 20
  min-y: 60
  max-y: 220
# 2026-10-25: эффекты переноса. Без них перенос выглядит как обрыв: затемнение скрывает подгрузку чанков,
# звук и заголовок показывают, что происходит. enabled: false отключает всё сразу.
effects:
  enabled: true
  # Заголовок при начале разогрева и при прибытии (одна строка в actionbar остаётся всегда).
  title: true
  start-sound: BLOCK_BEACON_ACTIVATE
  arrive-sound: ENTITY_ENDERMAN_TELEPORT
  arrive-particles: PORTAL
  # BLINDNESS — полное затемнение, DARKNESS — пульсирующее. 40 тиков (2 с) до переноса и 40 после: хватает,
  # чтобы не видеть подгрузку, и не раздражает. 0 — без затемнения.
  fade-effect: BLINDNESS
  fade-ticks: 40
  arrive-fade-ticks: 40
# Миры, в которых работает /rtp. Мир без enabled: true не переносит никого. Для каждого мира:
worlds:
  world:
    enabled: true
    # Центр — центр границы мира, обычно это спавн. Значение false — брать center-x / center-z.
    center-on-border: true
    center-x: 0
    center-z: 0
    # Ближе 200 блоков к центру — спавн-зона и толпа; минимум держит игрока от неё.
    min-radius: 200
    # 2000 блоков — достаточно, чтобы попасть в новый участок, но не тащить через всю карту. Для
    # границы 10000 блоков разумно поднять до 3000–5000.
    max-radius: 2000
    # circle — точки равномерны по площади; square — расстояние считается по большей из координат.
    shape: circle
    # Попыток на поиск, когда очередь пуста. В обычном мире из 20 колонок почти всегда есть
    # подходящая; больше — игрок дольше ждёт, а при нехватке точек лучше увеличить очередь.
    max-attempts: 20
    # Высота поверхности, при которой точка годится. Ниже 60 поверхность обычно под водой (уровень
    # моря 63); выше 220 — пики и скалы, где встать трудно. Для Незера: min-y — нижняя граница
    # поиска, max-y — потолок (ниже бедрока-крыши 127, например 120).
    min-y: 60
    max-y: 220
