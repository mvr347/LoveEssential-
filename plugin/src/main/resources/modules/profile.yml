# Пустые списки не ограничивают. Запрет важнее разрешения; required — все состояния, allowed — любое.
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []

# Тексты кнопок задаются ключами lang.yml; оформление не меняет права и обработчики.
gui:
  refresh-ticks: 20
  menus:
    profile-menu-title:
      size: 27
    public-profile-title:
      size: 27
    profile-menu-statistics:
      size: 27
