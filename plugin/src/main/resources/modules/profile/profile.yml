enabled: true
refresh-ticks: 40
persist-seconds: 300
privacy:
  default-visible: true
  default-activity-visible: true
links:
  account:
    plugin: LoveAuth
    command: loveauth account
    permission: ''
  behavior:
    plugin: LoveBehavior
    command: behavior
    permission: lovebehavior.behavior
  reputation:
    plugin: LoveBehavior
    command: rep {player}
    permission: lovebehavior.rep
  adaptations:
    plugin: LoveAdaptation
    command: loveadaptation mainmenu
    permission: loveadaptation.use
  suffixes:
    plugin: LoveSubnames
    command: suffixes
    permission: lovesubnames.use
  scoreboard:
    plugin: LoveEssential
    command: scoreboard
    permission: loveessential.scoreboard
  grammar:
    plugin: LoveChatFilter
    command: grammar
    permission: ''
  silent:
    plugin: Lovechat
    command: silent
    permission: ''
  mentions:
    plugin: Lovechat
    command: tagtoggle
    permission: ''
  channel:
    plugin: Lovechat
    command: channel global
    permission: ''
  channel-local:
    plugin: Lovechat
    command: channel local
    permission: ''
  clan-invites:
    plugin: LoveClans
    command: loveclan invites
    permission: ''
  player-trades:
    plugin: LoveTrades
    command: trade toggle
    permission: ''
reports:
  cooldown-seconds: 300
statistics:
  hide-unavailable: true
  placeholders:
    duels_honor: loveduels_honor
    duels_wins: loveduels_wins
    duels_losses: loveduels_losses
    duels_winrate: loveduels_winrate
    duels_streak: loveduels_streak
    duels_best_streak: loveduels_best_streak
    duels_money_won: loveduels_money_won
    hunt_rank: lovehunt_rank
    hunt_rating: lovehunt_rating
    hunt_completed: lovehunt_completed
    hunt_failed: lovehunt_failed
    hunt_reward_modifier: lovehunt_reward_modifier
    contracts_completed: lovecontracts_total_completed
    contracts_failed: lovecontracts_total_failed
    contracts_accepted: lovecontracts_total_accepted
    contracts_daily_completed: lovecontracts_daily_completed
    contracts_success_rate: lovecontracts_success_rate
    contracts_streak: lovecontracts_current_streak
    contracts_best_streak: lovecontracts_best_streak
    activities_wins: loveactivities_wins_total
    activities_losses: loveactivities_losses_total
    activities_winrate: loveactivities_winrate_total
    activities_money_won: loveactivities_won_money_total
    activities_money_lost: loveactivities_lost_money_total
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
