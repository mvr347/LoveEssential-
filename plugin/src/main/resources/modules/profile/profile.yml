enabled: true
refresh-ticks: 40
# Команда кнопки «Назад» в корневом меню, когда его открыли как /profile back (2026-11-01). Хаб-меню сервера
# открывает профиль с этим аргументом, чтобы игрок мог вернуться. Пусто — кнопки «Назад» нет.
back-command: menu
persist-seconds: 300
privacy:
  default-visible: true
  default-activity-visible: true
links:
  account:
    plugin: LoveAuth
    command: loveauth account
    # 2026-11-01: аргумент, с которым плагин открывается из профиля: LoveAuth возвращает игрока этой командой.
    from-profile: loveessential:profile
    permission: ''
  customization:
    plugin: LoveEssential
    command: le nick
    permission: ''
  behavior:
    plugin: LoveBehavior
    command: behavior
    from-profile: mainmenu
    # 2026-11-01: команда «Назад» передаётся аргументом, поэтому правка config.yml самого плагина не нужна.
    back-argument: loveessential:profile
    permission: lovebehavior.behavior
  reputation:
    plugin: LoveBehavior
    command: rep {player}
    permission: lovebehavior.rep
  adaptations:
    plugin: LoveAdaptation
    command: loveadaptation mainmenu
    back-argument: loveessential:profile
    permission: loveadaptation.use
  suffixes:
    plugin: LoveSubnames
    command: suffixes
    from-profile: loveessential:profile
    permission: lovesubnames.use
  display:
    plugin: LoveEssential
    command: display
    permission: ''
  scoreboard:
    plugin: LoveEssential
    command: scoreboard
    permission: loveessential.scoreboard
  grammar:
    plugin: LoveChatFilter
    command: grammar
    permission: ''
  silent:
    plugin: Lovechat
    command: silent
    permission: ''
  mentions:
    plugin: Lovechat
    command: tagtoggle
    permission: ''
  channel:
    plugin: Lovechat
    command: channel global
    permission: ''
  channel-local:
    plugin: Lovechat
    command: channel local
    permission: ''
  clan-invites:
    plugin: LoveClans
    command: loveclan invites
    permission: ''
  player-trades:
    plugin: LoveTrades
    command: trade toggle
    permission: ''
# Тексты переключателей меню настроек (2026-11-01): слова для шаблонов switch-* в gui.yml. Один набор на
# переключатель: так «Грамматика | Включено» и «Тихий режим | Выключен» читаются одинаково, а смысл
# (категория, функция, действие) меняется только здесь, без правки шаблонов. Цвета тегами MiniMessage.
switch-texts:
  grammar:
    name: Грамматика
    category: Модуль фильтрации чата
    function: Автоисправление орфографии сообщений.
    'on': <green>Включено
    'off': <gray>Выключено
    status-on: <green>Активно
    status-off: <gray>Отключено
    action-off: выключить автоисправление
    action-on: включить автоисправление
  silent:
    name: Тихий режим
    category: Режим концентрации
    function: Блокировка всех входящих сообщений чата.
    'on': <green>Включен
    'off': <gray>Выключен
    status-on: <green>Активен
    status-off: <gray>Отключен
    action-off: выключить тихий режим
    action-on: включить тихий режим
  mentions:
    name: Упоминания
    category: Звуковые оповещения
    function: Звуковой сигнал при теге ника (@ник).
    'on': <green>Включены
    'off': <gray>Выключены
    status-on: <green>Активно
    status-off: <gray>Отключено
    action-off: выключить упоминания
    action-on: включить упоминания
  clan-invites:
    name: Приглашения в клан
    category: Взаимодействие с кланами
    function: Прием инвайтов и приглашений в кланы.
    'on': <green>Разрешены
    'off': <red>Заблокированы
    status-on: <green>Разрешено
    status-off: <red>Заблокировано
    action-off: заблокировать приглашения
    action-on: разрешить приглашения
  player-trades:
    name: Обмен с игроками
    category: Торговля между игроками
    function: Прием запросов на безопасный обмен.
    'on': <green>Разрешен
    'off': <red>Заблокирован
    status-on: <green>Разрешено
    status-off: <red>Заблокировано
    action-off: заблокировать запросы
    action-on: разрешить запросы
  visibility:
    name: Видимость профиля
    category: Приватность
    function: Доступ других игроков к вашему профилю.
    'on': <green>Открыт
    'off': <gray>Скрыт
    status-on: <green>Открыт
    status-off: <gray>Скрыт
    action-off: скрыть профиль от других
    action-on: открыть профиль другим
  activity:
    name: Видимость активности
    category: Приватность
    function: Время игры, состояние и местоположение в профиле.
    'on': <green>Открыта
    'off': <gray>Скрыта
    status-on: <green>Открыта
    status-off: <gray>Скрыта
    action-off: скрыть активность
    action-on: показать активность
  channel:
    local:
      label: <yellow>Локальный
      detail: <yellow>Локальный <dark_gray>(100 блоков)
      action: переключить на Глобальный
    global:
      label: <green>Глобальный
      detail: <green>Глобальный <dark_gray>(весь мир)
      action: переключить на Локальный
    admin:
      label: <red>Администрация
      detail: <red>Админ-чат
      action: вернуться в Локальный
  messages:
    name: Личные сообщения
    category: Общение
    function: Принимать личные сообщения от игроков.
    'on': <green>Включены
    'off': <gray>Выключены
    status-on: <green>Принимаются
    status-off: <gray>Заблокированы
    action-off: выключить личные сообщения
    action-on: включить личные сообщения
reports:
  # 2026-10-27: 5 минут между жалобами одного автора — достаточно, чтобы нельзя было залить
  # ящик администрации, и не мешает пожаловаться на второго нарушителя после разбирательства.
  cooldown-seconds: 300
  # 2026-10-27: считаются жалобы от РАЗНЫХ игроков за последние 7 дней. Одиночные и старые
  # жалобы не накапливаются вечно, а повтор от одного автора не увеличивает счётчик.
  window-days: 7
  # 3 разных автора — оповещение онлайн-администрации (право loveessential.reports.notify);
  # 5 — риск временного бана: в списке жалоб появляется кнопка (право loveessential.reports.ban).
  # Сам плагин никого не банит: что делать на пороге, решает администратор.
  notify-threshold: 3
  danger-threshold: 5
  # На сколько очков вежливости падает игрок, когда администратор ПОДТВЕРЖДАЕТ жалобу.
  # Сама подача жалобы репутацию не меняет — защита от сговора против невиновного.
  confirm-politeness-delta: -100
  # Сообщать автору итог рассмотрения, если он сейчас онлайн.
  notify-author: true
  tempban:
    # Консольные команды кнопки «Временный бан». Пусто — кнопка скажет, что бан не настроен.
    # Плейсхолдеры: {player}, {duration}, {reason}. Причина — фиксированный текст ниже, а не
    # текст жалобы, чтобы игроки не могли подставить свои команды.
    # Пример для LiteBans: ['tempban {player} {duration} {reason}']
    commands: []
    duration: 1d
    reason: Жалобы игроков
