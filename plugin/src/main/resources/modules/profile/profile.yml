      - <green>ЛКМ <dark_gray>— <gray>открыть подробности
      public:
      - <dark_gray>Общая статистика
      - ''
      - '<gray>Побед: <duels_wins>'
      - '<gray>Честь: <duels_honor>'
    hunt:
      enabled: true
      plugin: LoveHunt
      activity-sensitive: false
      details:
        orders:
          title: <gold>Заказы
          lore:
          - <dark_gray>Подробности категории
