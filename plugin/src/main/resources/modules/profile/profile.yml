# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
enabled: true
refresh-ticks: 40
persist-seconds: 300
privacy:
  default-visible: true
  default-activity-visible: true
links:
  account:
    plugin: LoveAuth
    command: loveauth account
    permission: ''
  behavior:
    plugin: LoveBehavior
    command: behavior
    permission: lovebehavior.behavior
  reputation:
    plugin: LoveBehavior
    command: rep {player}
    permission: lovebehavior.rep
  adaptations:
    plugin: LoveAdaptation
    command: loveadaptation mainmenu
    permission: loveadaptation.use
  suffixes:
    plugin: LoveSubnames
    command: suffixes
    permission: lovesubnames.use
  nickname:
    plugin: LoveEssential
    command: nick
    permission: loveessential.nick
  scoreboard:
    plugin: LoveEssential
    command: scoreboard
    permission: loveessential.scoreboard
  grammar:
    plugin: LoveChatFilter
    command: grammar
    permission: ''
  silent:
    plugin: Lovechat
    command: silent
    permission: ''
  mentions:
    plugin: Lovechat
    command: tagtoggle
    permission: ''
  channel:
    plugin: Lovechat
    command: channel global
    permission: ''
  channel-local:
    plugin: Lovechat
    command: channel local
    permission: ''
  clan-invites:
    plugin: LoveClans
    command: loveclan invites
    permission: ''
  player-trades:
    plugin: LoveTrades
    command: trade toggle
    permission: ''
setting-controls:
  grammar:
    material: WRITABLE_BOOK
    link: grammar
    title: <gold>Грамматика
    lore:
    - <gray>Автоисправление LoveChat
    - '<gray>Состояние: <white><papi:lovechat_grammar:"—">'
    - <gray>ЛКМ — переключить.
  silent:
    material: FEATHER
    link: silent
    title: <gold>Тихий режим
    lore:
    - '<gray>Состояние: <white><papi:lovechat_silent_mode:"—">'
    - <gray>ЛКМ — переключить.
  mentions:
    material: NOTE_BLOCK
    link: mentions
    title: <gold>Упоминания
    lore:
    - '<gray>Блокировка упоминаний: <white><papi:lovechat_mentions_disabled:"—">'
    - <gray>ЛКМ — переключить.
  channel:
    material: PAPER
    link: channel
    title: <gold>Канал чата
    lore:
    - '<gray>Сейчас: <white><papi:lovechat_channel:"—">'
    - <gray>ЛКМ — переключить локальный/глобальный канал.
  clan-invites:
    material: WHITE_BANNER
    link: clan-invites
    title: <gold>Приглашения в клан
    lore:
    - '<gray>Разрешены: <white><papi:clans_invites_enabled:"—">'
    - <gray>ЛКМ — переключить.
  player-trades:
    material: EMERALD
    link: player-trades
    title: <gold>Обмен с игроками
    lore:
    - '<gray>Разрешён: <white><papi:lovetrades_requests_enabled:"—">'
    - <gray>ЛКМ — переключить.
reports:
  cooldown-seconds: 300
statistics:
  hide-unavailable: true
  placeholders:
    duels_honor: loveduels_honor
    duels_wins: loveduels_wins
    duels_losses: loveduels_losses
    duels_winrate: loveduels_winrate
    duels_streak: loveduels_streak
    duels_best_streak: loveduels_best_streak
    duels_money_won: loveduels_money_won
    hunt_rank: lovehunt_rank
    hunt_rating: lovehunt_rating
    hunt_completed: lovehunt_completed
    hunt_failed: lovehunt_failed
    hunt_reward_modifier: lovehunt_reward_modifier
    contracts_completed: lovecontracts_total_completed
    contracts_failed: lovecontracts_total_failed
    contracts_accepted: lovecontracts_total_accepted
    contracts_daily_completed: lovecontracts_daily_completed
    contracts_success_rate: lovecontracts_success_rate
    contracts_streak: lovecontracts_current_streak
    contracts_best_streak: lovecontracts_best_streak
    activities_wins: loveactivities_wins_total
    activities_losses: loveactivities_losses_total
    activities_winrate: loveactivities_winrate_total
    activities_money_won: loveactivities_won_money_total
    activities_money_lost: loveactivities_lost_money_total
  categories:
    world:
      enabled: true
      plugin: ''
      activity-sensitive: true
      details:
        visits:
          title: <gold>Время и визиты
          lore:
          - <dark_gray>Подробности категории
          - ''
          - '<gray>В игре: <playtime_hours> ч <playtime_minutes> мин'
          - '<gray>Первый вход: <first_join_local>'
          - '<gray>Последние данные: <last_seen_local>'
          - '<gray>Часовой пояс: Europe/Kiev'
        movement:
          title: <gold>Передвижение
          lore:
          - <dark_gray>Подробности категории
          - ''
          - '<gray>Пешком: <walk_km> км'
          - '<gray>Бегом: <sprint_km> км'
          - '<gray>Вплавь: <swim_km> км'
          - '<gray>На элитрах: <fly_km> км'
          - '<gray>Прыжков: <jumps>'
        mining:
          title: <gold>Добыча и использование
          lore:
          - <dark_gray>Подробности категории
          - ''
          - '<gray>Добыто блоков: <blocks_mined>'
          - '<gray>Использовано предметов-блоков: <blocks_used>'
          - <gray>Использование включает установки и другие действия.
        survival:
          title: <gold>Выживание и бои
          lore:
          - <dark_gray>Подробности категории
          - ''
          - '<gray>Убийств игроков: <kills>'
          - '<gray>Побеждено мобов: <mob_kills>'
          - '<gray>Смертей: <deaths>'
          - '<gray>K/D: <kd_ratio>'
          - '<gray>Нанесено урона: <damage_dealt>'
          - '<gray>Получено урона: <damage_taken>'
          - '<gray>После смерти: <time_since_death_hours> ч'
      title: <gold>Мир и выживание
      summary:
      - <dark_gray>Личная статистика
      - ''
      - '<gray>В игре: <playtime_hours> ч <playtime_minutes> мин'
      - '<gray>Смертей: <deaths>'
      - <dark_gray><st>─────────────────────
      - <green>ЛКМ <dark_gray>— <gray>открыть подробности
      public:
      - <dark_gray>Общая статистика
      - ''
      - '<gray>В игре: <playtime_hours> ч <playtime_minutes> мин'
      - '<gray>Первый вход: <first_join_local>'
    duels:
      enabled: true
      plugin: LoveDuels
      activity-sensitive: false
      details:
        results:
          title: <gold>Результаты
          lore:
          - <dark_gray>Подробности категории
          - ''
          - '<gray>Побед: <duels_wins>'
          - '<gray>Поражений: <duels_losses>'
          - '<gray>Побед: <duels_winrate>'
        streaks:
          title: <gold>Серии
          lore:
          - <dark_gray>Подробности категории
          - ''
          - '<gray>Текущая серия: <duels_streak>'
          - '<gray>Лучшая серия: <duels_best_streak>'
        rewards:
