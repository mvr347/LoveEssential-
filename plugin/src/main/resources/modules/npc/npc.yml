# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
enabled: true
allowed-types:
- MANNEQUIN
- VILLAGER
- WANDERING_TRADER
- ARMOR_STAND
- ZOMBIE
- SKELETON
- CAT
- WOLF
- IRON_GOLEM
- ALLAY
max-definitions: 1000
max-active: 200
max-route-points: 128
tracking:
  update-ticks: 2
  max-turn-degrees: 30
pathfinding:
  max-pending: 8
  capture-budget-ms: 2.0
  threads: 2
  radius: 16
  max-nodes: 4096
  plans-per-tick: 1
actions:
  max-economy-amount: 100000
  allowed-player-commands:
  - contracts
  - pcontract
  - suffixes
  - shops
  - trade
  - activities
  - duels
  - hunt
  - brew
  - spawn
  - home
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
