          dialog-node: <gold>Создать/изменить реплику
          dialog-answer: <gold>Создать/изменить ответ
          dialog-start: <gold>Начальный узел
          dialog-condition: <gold>Условие ответа
          dialog-actions: <gold>Действия ответа
          actions: <gold>Действия по клику
          enabled-hours: <gold>Работа по игровому времени
          hour-from: <gold>Начало, тики
          hour-to: <gold>Окончание, тики
          enabled: <gold>NPC включён
          collidable: <gold>Коллизия
          gravity: <gold>Гравитация
          invulnerable: <gold>Неуязвимость
          avoid-water: <gold>Избегать воды на маршруте
          can-open-doors: <gold>Открывать двери на маршруте
          teleport-on-stuck: <gold>Возврат домой при застревании
          follow-player: <gold>Игрок для сопровождения
          follow-distance: <gold>Дистанция сопровождения
          stuck-ticks: <gold>Ожидание при застревании, тики
        condition-title: <gold>Добавить условие
        action-title: <gold>Добавить действие
        clear-conditions: <red>Удалить все условия
        clear-actions: <red>Удалить все действия
        prompt-text: <yellow>Введите текст сообщения. Он будет сохранён в конфиге модуля.
        conditions:
