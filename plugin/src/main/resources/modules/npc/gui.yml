  npc-help:
    fields:
      id: '<gray>Уникальный ID NPC: 1–48 строчных латинских букв, цифр, _ или -. После публикации не меняется.'
      name: <gray>Имя над NPC с поддержкой цветовой разметки MiniMessage. Текст сохраняется в lang.yml.
      type: <gray>Модель сущности Minecraft. MANNEQUIN поддерживает скин игрока; возможности других моделей отличаются.
      spawn: <gray>Нажмите, чтобы NPC появлялся в вашей текущей позиции. Проверяется безопасность и территория.
      skin: <gray>Имя или UUID владельца скина для MANNEQUIN. «-» убирает выбранный скин.
      helmet: <gray>Материал предмета на голове NPC. AIR убирает предмет.
      chestplate: <gray>Материал нагрудника. AIR убирает предмет.
      leggings: <gray>Материал поножей. AIR убирает предмет.
      boots: <gray>Материал ботинок. AIR убирает предмет.
      main-hand: <gray>Предмет в основной руке. Сам по себе не назначает NPC профессию или действие.
      off-hand: <gray>Предмет во второй руке. AIR освобождает руку.
      pose: <gray>Поза модели. Набор доступных поз зависит от выбранной сущности.
      scale: '<gray>Размер модели: 1 — обычный, 0.1–8 — допустимые значения.'
      baby: <gray>Включает детскую модель, если выбранная сущность её поддерживает.
      glowing: <gray>Добавляет светящийся контур вокруг NPC.
      name-visible: <gray>Показывает или скрывает имя над сущностью.
      silent: <gray>Отключает обычные звуки сущности. Настроенный звук клика задаётся отдельно.
      personal: <gray>Каждый подходящий игрок видит свой экземпляр NPC с отдельным движением.
      visibility: <gray>Определяет, кто видит NPC. Можно назначить сразу несколько условий.
      access: <gray>Определяет, кто может взаимодействовать с видимым NPC.
      require-auth: <gray>При установленном LoveAuth допускает взаимодействие и видимость после авторизации.
      interaction-range: '<gray>Максимальная дистанция клика: от 1 до 16 блоков.'
      cooldown-ms: '<gray>Минимальная задержка между кликами игрока: 1000 мс = 1 секунда.'
      interaction-mode: '<gray>На какие клики реагировать: левый, правый или оба. Выберите вариант в меню.'
      line-of-sight: <gray>Запрещает взаимодействовать с NPC сквозь стену.
      interaction-sound: <gray>Звук при успешном клике. NONE или «-» отключает звук.
      interaction-volume: '<gray>Громкость звука клика: 0–4.'
      interaction-pitch: '<gray>Высота звука клика: 0.5–2.'
      movement: '<gray>Независимое поведение: стоять, идти по маршруту или следовать за игроком.'
      speed: '<gray>Множитель скорости передвижения: 0.1–5.'
      look-at: <gray>Поворачивает NPC к ближайшему доступному игроку, в том числе во время остановки движения.
      look-range: '<gray>На какой дистанции искать игрока для взгляда: 1–64 блока.'
      pause-on-interact: <gray>После клика останавливает движение на 10 секунд; взгляд продолжает работать.
      stuck-policy: '<gray>Что делать после неудачных попыток пройти: остановиться, пропустить точку или вернуться.'
      activation-range: '<gray>Дистанция появления и активности NPC: 4–192 блока.'
      follow-player: <gray>Настоящее имя игрока, за которым идти. «-» выбирает ближайшего доступного игрока.
      follow-distance: '<gray>На каком расстоянии остановиться при сопровождении: 1–32 блока.'
      stuck-ticks: <gray>Сколько тиков ждать при препятствии перед повторным поиском пути. 20 тиков = 1 секунда.
      point-add: <gray>Добавить вашу позицию в конец маршрута. Сначала встаньте на безопасное место.
      point-mode: <gray>ONCE — один проход; LOOP — круг; PING_PONG — туда-обратно; RANDOM — случайная точка.
      point-record: <gray>Переключает запись точек при вашем движении. Повторное нажатие выключает запись.
      point-tool: <gray>Выдаёт инструмент. ПКМ добавляет вашу текущую позицию в маршрут.
      point-show: <gray>Показывает точки частицами только вам.
      point-edit: <gray>Открывает список точек. Выберите точку, чтобы изменить ожидание, скорость, радиус или порядок.
      point-undo: <gray>Отменяет последнее изменение маршрута.
      point-redo: <gray>Повторяет отменённое изменение маршрута.
      dialog-node: '<gray>Добавить или изменить реплику: ID узла и текст, который увидит игрок.'
      dialog-answer: '<gray>Добавить вариант ответа: узел, ID ответа, следующий узел или end и текст.'
      dialog-start: <gray>ID реплики, с которой начинается диалог NPC.
      dialog-condition: <gray>Условие доступности конкретного ответа в диалоге.
      dialog-actions: <gray>Действия, которые выполняются после выбора ответа.
      actions: <gray>Любые назначенные действия по клику. Один NPC может сочетать меню, сообщения, оплату и диалог.
      enabled-hours: <gray>Показывать NPC только в выбранные часы игрового мира.
      hour-from: '<gray>Начало работы в тиках мира: 0 — утро, 12000 — закат, 18000 — полночь.'
      hour-to: '<gray>Конец работы в тиках мира: 0–23999. Можно задать интервал через полночь.'
      enabled: <gray>Разрешает появление этого NPC. Остальные настройки сохраняются.
      collidable: <gray>Разрешает столкновения с моделью NPC.
      gravity: <gray>Разрешает сущности падать под действием гравитации.
      invulnerable: <gray>Защищает NPC от обычного урона.
      avoid-water: <gray>Прокладывает наземный маршрут в обход воды.
      can-open-doors: <gray>Разрешает NPC открывать двери на пути.
      teleport-on-stuck: <gray>При RETURN_HOME разрешает безопасный телепорт к месту появления.
    examples:
      id: npc_01
      name: <gold>Хранитель
      skin: Notch
      follow-player: Steve
      description-key: npc.description.guard
  module-help:
    hologram:
      max-holograms:
        _description: <gray>Максимум определений в базе. Уже созданные объекты не удаляются.
      creation-height:
        _description: <gray>Высота нижней строки над игроком при создании. Строки растут вверх.
      max-visible-per-player:
        _description: <gray>Показывает ближайшие голограммы в пределах их дальности.
      max-display-entities:
        _description: <gray>Суммарный бюджет TextDisplay, ItemDisplay и Interaction для всех игроков.
    sitride:
      click-to-sit:
        _description: <gray>ПКМ пустой основной рукой по ступеням, плитам или ковру садит игрока. Shift пропускает действие.
      ride-range:
        _description: <gray>Максимальное расстояние до цели /ride. Проверяются прямая видимость, территория, бой и согласие игрока.
    traces:
      default-enabled:
        _description: <gray>Начальное состояние следов. Личный выбор /traces хранится в SQLite и имеет приоритет.
      stride:
        _description: <gray>Минимальное расстояние в блоках между следами. Повороты на месте следов не оставляют.
      interval-ms:
        _description: <gray>Ограничивает частоту частиц независимо от количества событий движения.
      view-distance:
        _description: <gray>Видят только авторизованные игроки поблизости, которым доступен сам игрок.
      color:
        _description: <gray>Шесть цифр RGB без решётки, например 78644B.
    nickname:
      min-length:
        _description: <gray>Минимальное число букв, цифр и _ в никнейме.
      max-length:
        _description: <gray>Максимальное число символов в никнейме.
      prevent-impersonation:
        _description: <gray>Запрещает совпадения с чужим известным именем и ником другого онлайн-игрока.
      default-color:
        _description: <gray>Цвет после сброса оформления. Пусто — наследовать цвет шаблона чата/TAB.
      apply-display-name:
        _description: <gray>Применять ник к Bukkit displayName; используется совместимыми чатами.
      apply-to-tab:
        _description: <gray>Подставлять никнейм в шаблоны имени TAB.
      apply-to-messages:
        _description: <gray>Показывать ник в личных сообщениях; команды ответа используют имя аккаунта.
    messages:
      max-length:
        _description: <gray>Максимум символов в одном личном сообщении.
      cooldown-ms:
        _description: <gray>Задержка между отправками. 1000 мс = 1 секунда.
      max-ignored:
        _description: <gray>Максимум игроков в персональном игнор-листе.
    inventory:
      refresh-ticks:
        _description: <gray>Интервал обновления живого инвентаря. 20 тиков = 1 секунда.
    profile:
      privacy:
        _description: <gray>Начальные значения для игроков без сохранённого выбора; личные переключатели хранятся в SQLite.
      links:
        _description: <gray>Команды исполняются от имени игрока, без OP и консоли. Проверяются плагин-владелец, права и доступ к профилю.
      adaptation-cards:
        _description: <gray>Карточки только для просмотра. Тексты по ключам lang.yml получают плейсхолдеры выбранного игрока.
      setting-controls:
        _description: <gray>Кнопки личных настроек профиля со ссылкой на команду модуля и локализованные подписи.
      refresh-ticks:
        _description: <gray>Как часто обновлять снимок данных для досье и плейсхолдеров.
      persist-seconds:
        _description: <gray>Как часто сохранять снимок профиля в SQLite, в секундах.
      cards:
        _description: <gray>Карточки досье. У каждой есть иконка, текст и отдельное право просмотра.
    home:
      default-limit:
        _description: <gray>Сколько домов можно сохранить без повышающего лимит права.
    afk:
      timeout-seconds:
        _description: <gray>Через сколько секунд без активности считать игрока AFK.
      kick-after-seconds:
        _description: <gray>Сколько секунд AFK допускается до отключения. 0 отключает автокик.
    nightskip:
      max-multiplier:
        _description: <gray>Максимальное ускорение ночи при сне игроков.
    npc:
      max-active:
        _description: <gray>Лимит одновременно появившихся экземпляров NPC, включая персональные.
      max-definitions:
        _description: <gray>Максимум сохранённых NPC в базе.
      max-route-points:
        _description: <gray>Максимум точек в одном маршруте.
      allowed-types:
        _description: <gray>Разрешённые модели сущностей для NPC. MANNEQUIN поддерживает скин игрока.
      pathfinding:
        _description: <gray>Ограничения наземного поиска пути; настройки числа потоков требуют перезапуска.
        threads:
          _description: <gray>Число потоков вычисления A*. Применяется после перезапуска сервера.
        radius:
          _description: <gray>Радиус снимка мира для поиска ближайшего участка маршрута.
        max-nodes:
          _description: <gray>Ограничение числа узлов A* на одну задачу.
        plans-per-tick:
          _description: <gray>Сколько NPC может начать поиск пути за один тик.
      tracking:
        _description: <gray>Плавность и частота поворота головы за игроками.
        update-ticks:
          _description: <gray>Интервал поворота NPC. 2 тика = 10 обновлений в секунду.
        max-turn-degrees:
          _description: <gray>Максимальный угол поворота за одно обновление. Меньше — плавнее.
      actions:
        _description: <gray>Доступные игровые действия и ограничения на экономику/команды.
        max-economy-amount:
          _description: <gray>Максимальная сумма одной операции NPC с физическими монетами.
        allowed-player-commands:
          _description: <gray>Разрешённые корневые команды для действий NPC от имени игрока.
    tab:
      engine:
        _description: <gray>native — оформление средствами Paper; tab — установленный TAB от NEZNAMY.
      refresh-ticks:
        _description: <gray>Интервал обновления оформления TAB в тиках.
      respect-other-scoreboards:
        _description: <gray>Не заменять scoreboard другого плагина без необходимости.
      sorting-enabled:
        _description: <gray>Включает управление порядком игроков в списке.
      sorting:
        _description: <gray>Порядок критериев сортировки, например group, затем name.
      name-enabled:
        _description: <gray>Разрешает применять имя, префикс и суффикс игрока в TAB.
      external:
        _description: <gray>Параметры внешнего TAB. После изменения примените экспорт через /le tab export.
    scoreboard:
      refresh-ticks:
        _description: 'Интервал в тиках: 20 = секунда. От 2 до 1200.'
      default-enabled:
        _description: Применяется только при отсутствии сохранённых предпочтений игрока.
      disabled-worlds:
        _description: Имена миров без учёта регистра. Дополняет запреты миров из редактора SQLite.
      enabled-worlds:
        _description: Пустой список допускает все миры. При заполнении табло видно только в этих мирах.
      disabled-gamemodes:
        _description: SURVIVAL, CREATIVE, ADVENTURE, SPECTATOR. Пусто — любой режим.
      display-permission:
        _description: Дополнительное permission для показа. Пустая строка — без дополнительной проверки.
      hide-while-afk:
        _description: Скрывать табло, пока LoveEssential считает игрока AFK.
      hide-in-combat:
        _description: Учитывает состояние боя из LoveCore.
      max-selected-lines:
        _description: От 1 до 8. Лимит редактора может дополнительно уменьшать это значение.
      overrides:
        _description: API для арен, заданий и событий. Личные настройки сохраняются.
        allow-forced:
          _description: Разрешает временный показ даже при личном выключении табло. Запреты миров действуют всегда.
        max-seconds:
          _description: От 1 до 86400 секунд. После истечения возвращается личное табло.
        per-player-limit:
          _description: От 1 до 32 одновременных запросов. Выигрывает запрос с большим приоритетом.
