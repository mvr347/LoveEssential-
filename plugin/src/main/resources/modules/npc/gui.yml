menus:
  access-editor-choice-title:
    size: 54
    title: <gold>Выбор условия
    labels:
      access-editor:
        access:
          title: <gold>Ограничения использования
          help: <gray>Правила для действий игрока и показа модуля. Административный редактор доступен по своему праву.
        allowed-worlds:
          title: <gold>Разрешённые миры
          help: <gray>Пустой список разрешает все миры. Поддерживаются шаблоны world_*; регистр не учитывается.
        denied-worlds:
          title: <gold>Запрещённые миры
          help: <gray>Запрет имеет приоритет над разрешением. Название мира или шаблон, например arena_*.
        allowed-gamemodes:
          title: <gold>Разрешённые режимы
          help: <gray>Пустой список разрешает все игровые режимы. Выберите нужные режимы в меню.
        denied-gamemodes:
          title: <gold>Запрещённые режимы
          help: <gray>Игрок не может использовать модуль в любом из выбранных режимов.
        allowed-states:
          title: <gold>Допустимые состояния
          help: <gray>Нужно хотя бы одно выбранное состояние. Пустой список не добавляет ограничений.
        denied-states:
          title: <gold>Запрещённые состояния
          help: '<gray>Любое совпадение блокирует действие: например бой, AFK или полёт.'
        required-states:
          title: <gold>Обязательные состояния
          help: <gray>Нужны сразу все выбранные состояния, например авторизован и на земле.
  gui-commands:
    size: 54
    title: <gold>Все команды
  gui-list-title:
    size: 54
    title: <gold>Список <dark_gray>| <yellow><path>
  gui-npc-title:
    size: 54
    title: <gold>NPC <dark_gray>| <yellow><id>
    labels:
      npc-editor:
        route-title: <gold>Точки маршрута NPC
        point: <gold>Точка <number>
        point-title: <gold>Точка маршрута <number>
        position: '<gray>Позиция: <white><x> <y> <z>'
        point-details: '<gray>Пауза: <white><wait> <gray>тиков • скорость: <white><speed> <gray>• радиус: <white><radius>'
        empty-route: <gray>Добавьте первую точку маршрута кнопкой в рабочей зоне.
        move-point: <gold>Перенести точку в вашу позицию
        move-up: <gold>Переместить точку раньше
        move-down: <gold>Переместить точку позже
        delete-point: <gold>Удалить эту точку маршрута
        point-fields:
          wait: <gold>Ожидание в точке
          speed: <gold>Скорость к точке
          radius: <gold>Радиус достижения
        point-help:
          wait: '<gray>Время остановки: 20 тиков = 1 секунда. Допустимо 0–72000.'
          speed: '<gray>Множитель скорости движения: от 0.1 до 5.'
          radius: '<gray>На каком расстоянии точка считается достигнутой: 0.1–8 блоков.'
        actions-title: <gold>Назначенные действия NPC
        action-order: '<gray>Порядок выполнения: <white><number>'
        action-controls: '<gray>ЛКМ: поднять раньше в списке. ПКМ: удалить с подтверждением.'
        empty-actions: <gray>Действий пока нет. Вернитесь и выберите нужное действие.
        stale: <yellow>Черновик уже изменён. Открыт актуальный редактор.
        actions-summary: 'Действий: <count>'
        conditions-summary: 'Условий: <count>'
        route-summary: 'Точек: <count>'
        dialog-summary: 'Реплик: <count>'
  gui-npcs:
    size: 54
    title: <gold>Персонажи
    create:
      title: <green>Создать NPC
      lore:
      - <gray>Создайте персонажа и настройте его действия.
      - <gray>Черновик сохраняется автоматически.
      - <dark_gray>─────────────────────
      - <green>ЛКМ — открыть мастер
    labels:
      gui:
        npc-list-edit: <green>ЛКМ — редактировать NPC
        npc-list-delete: <yellow>ПКМ — удалить NPC с подтверждением
  gui-place-title:
    size: 54
    title: <gold>Объект <dark_gray>| <yellow><id>
  gui-places-title:
    size: 54
    title: <gold>Объекты <dark_gray>| <yellow><kind>
  gui-settings-title:
    size: 54
    title: <gold>Настройки <dark_gray>| <yellow><module>
    labels:
      settings-help:
        section: <gray>Откройте раздел, чтобы настроить его параметры.
        boolean: <gray>Переключатель функции. Нажмите для смены состояния.
        number: <gray>Изменяйте число кнопками или введите точное значение.
        list: <gray>Откройте список, чтобы добавить, изменить или удалить элемент.
        text: <gray>Текстовое значение. При вводе «-» строка очищается.
        choices:
          native: <gold>Средствами Paper
          tab: <gold>Через установленный TAB от NEZNAMY
        change: <gold>Изменить на <amount>
        npc-number-shortcuts: '<gray>ПКМ: увеличить; Shift+ПКМ: уменьшить. ЛКМ: точный ввод.'
  gui-skin-title:
    size: 54
    title: <gold>Облик игрока
