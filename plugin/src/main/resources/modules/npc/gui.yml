          RETURN_HOME: <gold>Вернуться домой
          guard: <gold>Страж
          guide: <gold>Проводник
          merchant: <gold>Торговец
          quest: <gold>Квестодатель
          decoration: <gold>Декорация
          MANNEQUIN: <gold>Манекен
          VILLAGER: <gold>Житель
          WANDERING_TRADER: <gold>Странствующий торговец
          ARMOR_STAND: <gold>Стойка для брони
          ZOMBIE: <gold>Зомби
          SKELETON: <gold>Скелет
          CAT: <gold>Кошка
          WOLF: <gold>Волк
          IRON_GOLEM: <gold>Железный голем
          ALLAY: <gold>Тихоня
      npc-help:
        fields:
          id: '<gray>Уникальный ID NPC: 1–48 строчных латинских букв, цифр, _ или -. После публикации не меняется.'
          name: <gray>Имя над NPC с поддержкой цветовой разметки MiniMessage. Текст сохраняется в конфиге модуля.
          type: <gray>Модель сущности Minecraft. MANNEQUIN поддерживает скин игрока; возможности других моделей отличаются.
          spawn: <gray>Нажмите, чтобы NPC появлялся в вашей текущей позиции. Проверяется безопасность и территория.
          skin: <gray>Имя или UUID владельца скина для MANNEQUIN. «-» убирает выбранный скин.
          helmet: <gray>Материал предмета на голове NPC. AIR убирает предмет.
          chestplate: <gray>Материал нагрудника. AIR убирает предмет.
          leggings: <gray>Материал поножей. AIR убирает предмет.
          boots: <gray>Материал ботинок. AIR убирает предмет.
          main-hand: <gray>Предмет в основной руке. Сам по себе не назначает NPC профессию или действие.
          off-hand: <gray>Предмет во второй руке. AIR освобождает руку.
          pose: <gray>Поза модели. Набор доступных поз зависит от выбранной сущности.
          scale: '<gray>Размер модели: 1 — обычный, 0.1–8 — допустимые значения.'
          baby: <gray>Включает детскую модель, если выбранная сущность её поддерживает.
          glowing: <gray>Добавляет светящийся контур вокруг NPC.
          name-visible: <gray>Показывает или скрывает имя над сущностью.
          silent: <gray>Отключает обычные звуки сущности. Настроенный звук клика задаётся отдельно.
          personal: <gray>Каждый подходящий игрок видит свой экземпляр NPC с отдельным движением.
          visibility: <gray>Определяет, кто видит NPC. Можно назначить сразу несколько условий.
          access: <gray>Определяет, кто может взаимодействовать с видимым NPC.
          require-auth: <gray>При установленном LoveAuth допускает взаимодействие и видимость после авторизации.
          interaction-range: '<gray>Максимальная дистанция клика: от 1 до 16 блоков.'
          cooldown-ms: '<gray>Минимальная задержка между кликами игрока: 1000 мс = 1 секунда.'
          interaction-mode: '<gray>На какие клики реагировать: левый, правый или оба. Выберите вариант в меню.'
          line-of-sight: <gray>Запрещает взаимодействовать с NPC сквозь стену.
          interaction-sound: <gray>Звук при успешном клике. NONE или «-» отключает звук.
          interaction-volume: '<gray>Громкость звука клика: 0–4.'
          interaction-pitch: '<gray>Высота звука клика: 0.5–2.'
          movement: '<gray>Независимое поведение: стоять, идти по маршруту или следовать за игроком.'
          speed: '<gray>Множитель скорости передвижения: 0.1–5.'
          look-at: <gray>Поворачивает NPC к ближайшему доступному игроку, в том числе во время остановки движения.
          look-range: '<gray>На какой дистанции искать игрока для взгляда: 1–64 блока.'
          pause-on-interact: <gray>После клика останавливает движение на 10 секунд; взгляд продолжает работать.
          stuck-policy: '<gray>Что делать после неудачных попыток пройти: остановиться, пропустить точку или вернуться.'
          activation-range: '<gray>Дистанция появления и активности NPC: 4–192 блока.'
          follow-player: <gray>Настоящее имя игрока, за которым идти. «-» выбирает ближайшего доступного игрока.
          follow-distance: '<gray>На каком расстоянии остановиться при сопровождении: 1–32 блока.'
          stuck-ticks: <gray>Сколько тиков ждать при препятствии перед повторным поиском пути. 20 тиков = 1 секунда.
          point-add: <gray>Добавить вашу позицию в конец маршрута. Сначала встаньте на безопасное место.
          point-mode: <gray>ONCE — один проход; LOOP — круг; PING_PONG — туда-обратно; RANDOM — случайная точка.
          point-record: <gray>Переключает запись точек при вашем движении. Повторное нажатие выключает запись.
          point-tool: <gray>Выдаёт инструмент. ПКМ добавляет вашу текущую позицию в маршрут.
          point-show: <gray>Показывает точки частицами только вам.
          point-edit: <gray>Открывает список точек. Выберите точку, чтобы изменить ожидание, скорость, радиус или порядок.
          point-undo: <gray>Отменяет последнее изменение маршрута.
          point-redo: <gray>Повторяет отменённое изменение маршрута.
          dialog-node: '<gray>Добавить или изменить реплику: ID узла и текст, который увидит игрок.'
          dialog-answer: '<gray>Добавить вариант ответа: узел, ID ответа, следующий узел или end и текст.'
          dialog-start: <gray>ID реплики, с которой начинается диалог NPC.
          dialog-condition: <gray>Условие доступности конкретного ответа в диалоге.
          dialog-actions: <gray>Действия, которые выполняются после выбора ответа.
          actions: <gray>Любые назначенные действия по клику. Один NPC может сочетать меню, сообщения, оплату и диалог.
          enabled-hours: <gray>Показывать NPC только в выбранные часы игрового мира.
          hour-from: '<gray>Начало работы в тиках мира: 0 — утро, 12000 — закат, 18000 — полночь.'
          hour-to: '<gray>Конец работы в тиках мира: 0–23999. Можно задать интервал через полночь.'
          enabled: <gray>Разрешает появление этого NPC. Остальные настройки сохраняются.
          collidable: <gray>Разрешает столкновения с моделью NPC.
          gravity: <gray>Разрешает сущности падать под действием гравитации.
          invulnerable: <gray>Защищает NPC от обычного урона.
          avoid-water: <gray>Прокладывает наземный маршрут в обход воды.
          can-open-doors: <gray>Разрешает NPC открывать двери на пути.
          teleport-on-stuck: <gray>При RETURN_HOME разрешает безопасный телепорт к месту появления.
  module-menu-title:
    size: 54
    title: <gold>Настройки модулей LoveEssential
    labels:
      module-menu:
        descriptions:
          worlds:
          - <gray>Создание, импорт, загрузка и настройки отдельных миров. /le worlds.
          scenarios:
          - <gray>Действия при первом входе и других событиях. /le scenario.
          dialogs:
          - '<gray>Нативные окна Paper: текст, поля ввода и кнопки. /le dialog.'
