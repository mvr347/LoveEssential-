        _description: <gray>Лимит одновременно появившихся экземпляров NPC, включая персональные.
      max-definitions:
        _description: <gray>Максимум сохранённых NPC в базе.
      max-route-points:
        _description: <gray>Максимум точек в одном маршруте.
      allowed-types:
        _description: <gray>Разрешённые модели сущностей для NPC. MANNEQUIN поддерживает скин игрока.
      pathfinding:
        _description: <gray>Ограничения наземного поиска пути; настройки числа потоков требуют перезапуска.
        threads:
          _description: <gray>Число потоков вычисления A*. Применяется после перезапуска сервера.
        radius:
          _description: <gray>Радиус снимка мира для поиска ближайшего участка маршрута.
        max-nodes:
          _description: <gray>Ограничение числа узлов A* на одну задачу.
        plans-per-tick:
          _description: <gray>Сколько NPC может начать поиск пути за один тик.
      tracking:
        _description: <gray>Плавность и частота поворота головы за игроками.
        update-ticks:
          _description: <gray>Интервал поворота NPC. 2 тика = 10 обновлений в секунду.
        max-turn-degrees:
          _description: <gray>Максимальный угол поворота за одно обновление. Меньше — плавнее.
      actions:
        _description: <gray>Доступные игровые действия и ограничения на экономику/команды.
        max-economy-amount:
          _description: <gray>Максимальная сумма одной операции NPC с физическими монетами.
        allowed-player-commands:
          _description: <gray>Разрешённые корневые команды для действий NPC от имени игрока.
    tab:
      refresh-ticks:
        _description: <gray>Базовый интервал обновления списка TAB в тиках. 10 тиков = 0,5 секунды.
      respect-other-scoreboards:
        _description: <gray>Не заменять scoreboard другого плагина без необходимости.
      sorting-enabled:
        _description: <gray>Включает управление порядком игроков в списке.
      sorting:
        _description: '<gray>Порядок критериев: group, name, a-z, z-a, number:%p%, permissions:p1,p2, placeholder:%p%:v1,v2.'
      bossbar-refresh-ticks:
        _description: <gray>Интервал обновления полосок в тиках.
    scoreboard:
      refresh-ticks:
        _description: 'Интервал в тиках: 20 = секунда. От 2 до 1200.'
