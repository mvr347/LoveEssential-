      creation-height:
        _description: <gray>Высота нижней строки над игроком при создании. Строки растут вверх.
      max-visible-per-player:
        _description: <gray>Показывает ближайшие голограммы в пределах их дальности.
      max-display-entities:
        _description: <gray>Суммарный бюджет TextDisplay, ItemDisplay и Interaction для всех игроков.
    sitride:
      click-to-sit:
        _description: <gray>ПКМ пустой основной рукой по ступеням, плитам или ковру садит игрока. Shift пропускает действие.
      ride-range:
        _description: <gray>Максимальное расстояние до цели /ride. Проверяются прямая видимость, территория, бой и согласие
          игрока.
    traces:
      default-enabled:
        _description: <gray>Начальное состояние следов. Личный выбор /traces хранится в SQLite и имеет приоритет.
      stride:
        _description: <gray>Минимальное расстояние в блоках между следами. Повороты на месте следов не оставляют.
      interval-ms:
        _description: <gray>Ограничивает частоту частиц независимо от количества событий движения.
      view-distance:
        _description: <gray>Видят только авторизованные игроки поблизости, которым доступен сам игрок.
      color:
        _description: <gray>Шесть цифр RGB без решётки, например 78644B.
    nickname:
      min-length:
        _description: <gray>Минимальное число букв, цифр и _ в никнейме.
      max-length:
        _description: <gray>Максимальное число символов в никнейме.
      prevent-impersonation:
        _description: <gray>Запрещает совпадения с чужим известным именем и ником другого онлайн-игрока.
      default-color:
        _description: <gray>Цвет после сброса оформления. Пусто — наследовать цвет шаблона чата/TAB.
      apply-display-name:
        _description: <gray>Применять ник к Bukkit displayName; используется совместимыми чатами.
      apply-to-tab:
        _description: <gray>Подставлять никнейм в шаблоны имени TAB.
      apply-to-messages:
        _description: <gray>Показывать ник в личных сообщениях; команды ответа используют имя аккаунта.
    messages:
      max-length:
        _description: <gray>Максимум символов в одном личном сообщении.
      cooldown-ms:
        _description: <gray>Задержка между отправками. 1000 мс = 1 секунда.
      max-ignored:
        _description: <gray>Максимум игроков в персональном игнор-листе.
    inventory:
      refresh-ticks:
        _description: <gray>Интервал обновления живого инвентаря. 20 тиков = 1 секунда.
    profile:
      privacy:
        _description: <gray>Начальные значения для игроков без сохранённого выбора; личные переключатели хранятся в SQLite.
      links:
        _description: <gray>Команды исполняются от имени игрока, без OP и консоли. Проверяются плагин-владелец, права и доступ
          к профилю.
      adaptation-cards:
        _description: <gray>Карточки только для просмотра. Тексты из конфига модуля получают плейсхолдеры выбранного игрока.
      setting-controls:
        _description: <gray>Кнопки личных настроек профиля со ссылкой на команду модуля и локализованные подписи.
      refresh-ticks:
        _description: <gray>Как часто обновлять снимок данных для досье и плейсхолдеров.
      persist-seconds:
        _description: <gray>Как часто сохранять снимок профиля в SQLite, в секундах.
      cards:
        _description: <gray>Карточки досье. У каждой есть иконка, текст и отдельное право просмотра.
    afk:
