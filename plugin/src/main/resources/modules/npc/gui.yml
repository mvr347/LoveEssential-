    command-help:
      worlds: '<gray>Миры: создать, импортировать, загрузить, переместиться и изменить настройки.'
      scenario: <gray>Редактор сценариев событий, условий, задержек и действий.
      dialog: <gray>Создать и изменить нативное диалоговое окно Paper.
      motd: <gray>Редактор двух строк MOTD с предпросмотром в диалоговом окне.
      scoreboard: <gray>Настроить строки, порядок и оформление личного табло.
      recipes: <gray>Каталог рецептов и редактор крафтов 3×3.
      starter: <gray>Предметы первого входа; claim — забрать, edit — настроить.
      nick: <gray>Изменить никнейм, цвет или градиент; сбросить к имени аккаунта.
      msg: <gray>Личное сообщение или меню выбора получателя.
      reply: <gray>Ответить последнему собеседнику.
      ignore: <gray>Игнорировать игрока или открыть настройки личных сообщений.
      msgtoggle: <gray>Включить или отключить личные сообщения.
      invsee: <gray>Просмотр инвентаря; режим edit позволяет менять предметы при наличии права.
      loveessential: <gray>Главная панель, модули и настройки.
      npc: <gray>Создать, изменить или удалить персонажа.
      home: <gray>Телепорт к своему дому.
      homes: <gray>Меню сохранённых домов.
      sethome: <gray>Сохранить текущую позицию как дом.
      delhome: <gray>Удалить сохранённый дом.
      spawn: <gray>Телепорт на спавн.
      setspawn: <gray>Сохранить точку спавна. Требуются права администратора.
      tpa: <gray>Отправить запрос телепорта к игроку.
      tpahere: <gray>Пригласить игрока к себе.
      tpaccept: <gray>Принять запрос телепорта.
      tpdeny: <gray>Отклонить запрос телепорта.
      back: <gray>Вернуться к предыдущей позиции.
      vanish: <gray>Переключить невидимость. Требуется соответствующее право.
      afk: <gray>Переключить статус AFK.
      skin: <gray>Установить скин по имени игрока.
      hat: <gray>Надеть один предмет из руки; предыдущий шлем вернётся в руку.
      traces: <gray>Включить или выключить свои следы при ходьбе.
      heal: <gray>Восстановить своё здоровье.
      feed: <gray>Восстановить свою сытость.
      fly: <gray>Включить или выключить разрешение на полёт.
      speed: <gray>Установить скорость ходьбы или полёта от 0 до 10.
      gamemode: <gray>Изменить свой игровой режим.
      repair: <gray>Починить предмет в основной руке.
      sit: <gray>Сесть на поверхность. Повтор команды или Shift — встать.
      ride: <gray>Сесть на ближайшую подходящую сущность.
      profile: <gray>Посмотреть свой профиль Love.
      hologram: <gray>Создать, переместить или удалить голограмму.
      portal: <gray>Настроить область и назначение портала.
