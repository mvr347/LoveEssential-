        _description: Применяется только при отсутствии сохранённых предпочтений игрока.
      delay-on-join-ms:
        _description: Задержка первого показа после входа, от 0 до 60000 мс.
      show-seconds:
        _description: Сколько секунд длится /le scoreboard show. От 1 до 3600.
      overrides:
        _description: API для арен, заданий и событий. Личные настройки сохраняются.
        allow-forced:
          _description: Разрешает временный показ даже при личном выключении табло. Условия display-condition действуют всегда.
        max-seconds:
          _description: От 1 до 86400 секунд. После истечения показывается обычное именованное табло.
        per-player-limit:
          _description: От 1 до 32 одновременных запросов. Выигрывает запрос с большим приоритетом.
