# Каталог ачивок. Порядок в файле - порядок в меню.
#   category    - категория из списка выше;  rarity - COMMON, RARE, EPIC или LEGENDARY;
#   name/description - название и что нужно сделать;  hint - намёк для скрытой до получения;
#   hidden      - true: до получения в меню показано «???» и только намёк;
#   icon        - своя голова (base64), иначе голова редкости;  reward-text - что даёт (только текст для меню);
#   trigger     - условие:
#     {type: counter, key: <метрика или счётчик>, at-least: N}  - значение достигло N (метрики StatBus: bounties.completed,
#                   brewer.beverages, trades.completed, duels.won, kills ...; свои счётчики: play.hours, join.streak,
#                   join.days, revive.saved);
#     {type: set, key: <набор>, values: [...]}                  - собраны все значения набора (плагин зовёт collect);
#     {type: all-of, ids: [...]}                                - получены все перечисленные ачивки;
#     {type: unlocked-count, at-least: N}                       - получено N ачивок (метаачивки не считаются);
#     без trigger или {type: manual}                            - выдаёт плагин-источник вызовом unlock.
