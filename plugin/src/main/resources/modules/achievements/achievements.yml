# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
# Модуль «Ачивки» (добавлен 2026-11-10): общие достижения сервера. Плагины сообщают факты через сервис
# Achievements из LoveCore (progress/set/collect/unlock) и через общую шину метрик StatBus; каталог (названия,
# редкости, условия) ведёт этот файл, поэтому новую ачивку можно добавить без пересборки плагинов. Прогресс
# хранится в SQLite отдельно у каждого игрока. Награда ачивки здесь не описана: вход/выход (joinquit.yml) и
# пометки (LoveSubnames) сами ссылаются на ачивку полем achievement и спрашивают, получена ли она, поэтому
# ачивка может ничего не давать, давать только пометку, только оформление входа или и то и другое.
# Книга тайн влита сюда: тайны это скрытые ачивки категории secret с идентификаторами secret_<id>.
enabled: true
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
# 2026-11-10: на весь сервер объявляются ачивки этой редкости и выше (COMMON, RARE, EPIC, LEGENDARY или OFF).
