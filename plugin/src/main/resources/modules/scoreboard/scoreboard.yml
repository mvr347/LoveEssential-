# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
# 2026-10-23: у каждого игрока есть личное табло: он сам выбирает до 8 строк каталога (title, top,
# separator, bottom, categories, presets, placeholders ниже) командой /scoreboard. Порядок показа:
# 1) временное табло другого плагина (ScoreboardService) — важнее всех;
# 2) именованное табло из scoreboards с НЕПУСТЫМ display-condition, если условие выполнено (бой, событие);
# 3) личное табло игрока;
# 4) именованное табло без условия — запасное, когда у игрока нет ни одной доступной строки.
# Правила «скрывать в мирах, режимах, при AFK и в бою» задаются условиями из modules/tab/tab.yml.
enabled: true
# 2026-10-22: табло включено всем по умолчанию; игрок выключает его в меню /scoreboard или через /scoreboard toggle.
default-enabled: true
# 2026-10-22: 1 с после входа — клиент успевает завершить вход; иначе табло может пропасть на первом кадре.
delay-on-join-ms: 1000
# 2026-10-22: /le scoreboard show показывает табло на минуту: этого хватает, чтобы прочитать его.
show-seconds: 60
overrides:
  # 2026-10-22: временные табло других плагинов разрешено показывать даже при выключенном личном
  # табло (как важные объявления). Выключите, если такие объявления нужно скрывать.
  allow-forced: true
  # 2026-10-22: 600 с — больше десяти минут временное табло уже не временное.
  max-seconds: 600
  # 2026-10-22: 8 временных табло на игрока — с запасом для нескольких плагинов.
  per-player-limit: 8
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
# ─── Личное табло (формат LoveTweaks) ───────────────────────────────────────────
# 2026-10-23: update-interval — 20 тиков (1 с): значения не отстают, но табло не перерисовывается
# каждый тик (прежний ключ refresh-ticks читается, если update-interval не задан).
# Название личного скорборда (§-коды или &-коды, всегда отображается как заголовок)
title: '&FVOIDCORE'
# Строка-разделитель между парами плейсхолдеров (по умолчанию пустая строка)
separator: ''
# 2026-10-23: верхняя строка (первая строка тела, сразу под заголовком). Центрируется так же, как
# нижняя. Если пустая, на её месте стоит строка-разделитель.
top: ''
# Нижняя строка (последняя строка тела). Автоматически центрируется и расширяет скорборд
# с безопасными отступами по бокам, чтобы крайние символы никогда не съедались.
bottom: '&c✌ &7V O I D C O R E &c✌'
# Интервал обновления в тиках (20 = 1 секунда)
update-interval: 20
# Максимальное кол-во плейсхолдеров, которые игрок может включить одновременно.
# Плейсхолдеры отображаются на скорборде парами (по 2 в ряд), каждая пара
# завершается строкой-разделителем — при 8 плейсхолдерах получится ровно
# 8 строк + 4 разделителя = 12 строк тела скорборда.
# Потолок 8 жёсткий (2026-10-14): ровно столько нумерованных карточек-слотов помещается в меню
# (2x4), а клиентский скорборд не вмещает больше 15 строк. Значение больше 8 будет урезано до 8.
max-placeholders: 8
# Миры, в которых скорборд не отображается
disabled-worlds: []

# Стиль строк (2026-10-25): каждая строка читается как короткая фраза о герое — «служит в …», «одолел N чужих бойцов»,
# «куёт влияние для союза». Серый &7 — связки слов, белый &f — значения, цвет и значок — тема строки.
# Категории скорборда (2026-10-14): меню /scoreboard теперь делится на категории вместо одного
# длинного списка из ~40 строк — иначе игрок тонул бы в кнопках. Порядок здесь = порядок кнопок
# в ряду категорий (слоты 37-43, влезает максимум 7). icon (необязательно) — своя голова вместо
# общей из gui.category-button.
categories:
  general:
    display-name: '&bОбщее'
    lore:
      - '&7Координаты, мир, пинг, дата и время'
  reputation:
    display-name: '&dРепутация'
    lore:
      - '&7Карма, стиль игры и пометки'
  combat:
    display-name: '&cБой'
    lore:
      - '&7Убийства, смерти и дуэли'
  clans:
    display-name: '&6Кланы'
    lore:
      - '&7Данные вашего клана'
  hunt:
    display-name: '&2Охота'
    lore:
      - '&7Ранг охотника и заказы'
  craft:
    display-name: '&eРемесло'
    lore:
      - '&7Пивоварение и адаптации'
  activities:
    display-name: '&aАктивности'
    lore:
      - '&7Контракты, мини-игры и приваты'

# Быстрые раскладки (2026-10-14): одна кнопка в шапке меню заменяет весь текущий набор.
# Раскладка нужна, потому что собирать табло по одной строке из 40 долго, а большинству
# игроков нужен один из 3-4 типовых наборов. В шапке 6 слотов управления, один занят
# переключателем вида — поэтому раскладок максимум 5 (лишние игнорируются).
# placeholders: id строки или id:номер_варианта (с нуля). Строки, которые игроку сейчас
# недоступны (нет клана, не установлен плагин), при применении пропускаются, а в лоре кнопки
# помечены заранее. Лимит строк (max-placeholders) тоже соблюдается.
default-preset: standard
presets:
  standard:
    name: '&6Стандартная'
    lore:
      - '&7Базовый набор для повседневной игры'
    placeholders: [coords, datetime:2, playtime, karma, clan_tag, ping]
  small:
    name: '&6Маленькая'
    lore:
      - '&7Только координаты и время'
    placeholders: [coords, datetime:1]
  combat:
    name: '&6Боевая'
    lore:
      - '&7Статистика боёв и охоты'
    placeholders: [kills, deaths, kd_ratio, duel_honor, duels:1, hunt_rank]
  clan:
    name: '&6Клановая'
    lore:
      - '&7Данные вашего клана'
    placeholders: [clan_tag, clan_role, clan_level, clan_influence, clan_territories]

# Плейсхолдеры скорборда — каждый плейсхолдер это одна строка.
# Используются ТОЛЬКО кешированные параметры PAPI (2026-10-14): скорборд обновляется каждую
# секунду для каждого игрока на главном потоке, поэтому параметры с запросами в БД
# (например, часть lovecontracts и wanderer_deal_* в loveshop) сюда не подключаем.
# category: id категории из блока categories выше.
# variants (необязательно): несколько форматов одной строки, переключаются Shift+ЛКМ.
#   Вместо variants можно написать один template — это один безымянный формат.
# Если расширение PAPI, которое использует шаблон (%id_...%), не зарегистрировано
#   (плагин не установлен) — строка в меню серая с причиной «Плагин не установлен»
#   и на табло не показывается. Так не получается сырого «%id_param%» на экране.
# requirement (необязательно): плейсхолдер блокируется в GUI и пропускается на
#   скорборде, пока не выполнено условие.
#     placeholder: PAPI-выражение для проверки, например '%clans_in_clan%'
#     equals (необязательно): требуемое значение; если не указано — условие
#       считается выполненным, если PAPI вернул непустой результат
#     reason: причина блокировки, показывается в лоре кнопки
# Старое поле sort-group больше не нужно: оно заменено на category (при его наличии без
#   category строка попадёт в категорию по таблице 0→general, 5/20→reputation, 10→clans,
#   30→combat, 35→general).
placeholders:
  # ── Общее ──
  coords:
    display-name: '&bКоординаты'
    # Свой %lovetweaks_*%, а не %player_x%: не зависит от расширения Player
    template: '&6x &b%lovetweaks_x%&7, &6y &b%lovetweaks_y%&7, &6z &b%lovetweaks_z%'
    lore:
      - '&7Текущие координаты игрока'
    category: general

  world:
    display-name: '&bМир'
    template: '&7бродит по миру &b%lovetweaks_world%'
    lore:
      - '&7Мир, в котором вы находитесь'
    category: general

  ping:
    display-name: '&7Пинг'
    template: '&7отклик &a⚡ &f%lovetweaks_ping% &7мс'
    lore:
      - '&7Соединение с сервером'
    category: general

  # 2026-10-25: строка в духе остальных — «странствует N ч. на север». Нужны расширения Statistic и Player.
  wander:
    display-name: '&bСтранствия'
    template: '&7странствует &b%statistic_hours_played% &7ч. &6⏳ &8на &e%player_direction%'
    lore:
      - '&7Сколько часов вы в игре и куда смотрите'
    category: general

  # Дата и время слиты в одну строку (2026-10-14): раньше были три отдельные кнопки
  # (date/time/server_time), которые занимали три слота ради одного и того же.
  # Время 24-часовое (HH:mm), а не «hh:mm a»: 12-часовой формат с AM/PM читался плохо,
  # а месяц текстом (MMM) мог выйти по-английски — поэтому дата числовая dd.MM.yyyy.
  datetime:
    display-name: '&7Дата и время'
    lore:
      - '&7Дата и время сервера'
      - '&8Shift+ЛКМ — сменить формат'
    category: general
    variants:
      - name: 'Дата'
        template: '&7сегодня &6☀ &f%server_time_dd.MM.yyyy%'
      - name: 'Время'
        template: '&7на часах &6⏳ &f%server_time_HH:mm%'
      - name: 'Дата и время'
        template: '&7на часах &6⏳ &f%server_time_dd.MM.yyyy HH:mm%'

  # %playtime_formatted% вместо %playtime_since_join% (2026-10-14): since_join отдавал ВСЕ
  # часы целиком, поэтому у новичков строка «0 часов на сервере» висела первые 59 минут.
  playtime:
    display-name: '&bВремя в игре'
    lore:
      - '&7Всё время, проведённое на сервере'
      - '&8Shift+ЛКМ — сменить формат'
    category: general
    variants:
      - name: 'Всего'
        template: '&7странствует &b%playtime_formatted% &6⏳'
      - name: 'Эта сессия'
        template: '&7в этой вылазке &b%playtime_session_formatted% &6⏳'

  first_join:
    display-name: '&7Первый вход'
    template: '&7пришёл в королевство &f%playtime_first_join%'
    lore:
      - '&7Дата вашего первого входа на сервер'
    category: general

  # ── Репутация ──
  karma:
    display-name: '&eКарма'
    lore:
      - '&7Очки кармы (вежливости) на сервере'
      - '&8Shift+ЛКМ — сменить формат'
    category: reputation
    variants:
      - name: 'Очки'
        template: '&7слава за вежливость &e⚖ &f%lovebehavior_politeness_points%'
      - name: 'Ранг'
        template: '&7слывёт &e⚖ &f%lovebehavior_politeness_name%'

  # Требование убрано (2026-10-14): оно проверяло, что плейсхолдер вообще что-то возвращает,
  # а LoveBehavior возвращает значение всегда — то есть условие никогда не блокировало.
  behavior:
    display-name: '&8Стиль игры'
    template: '&7нравом &8☯ &f%lovebehavior_playstyle_name%'
    lore:
      - '&7Ваш текущий стиль игры'
    category: reputation

  suffix:
    display-name: '&dПометка'
    template: '&d✦ &dносит титул &f%lovesubnames_current%'
    lore:
      - '&7Текущая пометка (суффикс) игрока'
    category: reputation
    requirement:
      placeholder: '%lovesubnames_current%'
      reason: '&7Нужна активная пометка'

  suffix_collected:
    display-name: '&dСобрано пометок'
    template: '&d✦ &7собрал пометок &f%lovesubnames_unlocked_count%&7/&f%lovesubnames_total_count%'
    lore:
      - '&7Сколько пометок открыто из всех'
    category: reputation

  # ── Бой ──
  kills:
    display-name: '&cУбийства'
    template: '&aодолел &f%statistic_player_kills% &a⚔ &7чужих бойцов'
    lore:
      - '&7Количество убийств игроков'
    category: combat

  deaths:
    display-name: '&7Смерти'
    template: '&7потерпел &c💀 &f%statistic_deaths% &cпоражений'
    lore:
      - '&7Количество смертей'
    category: combat

  mob_kills:
    display-name: '&aУбийства мобов'
    template: '&7сразил &a⚔ &f%lovetweaks_mob_kills% &7чудовищ'
    lore:
      - '&7Количество убитых мобов'
    category: combat

  # id остался kd_ratio ради сохранённых настроек игроков; шаблон переведён на %lovetweaks_kd%,
  # потому что расширения kd_ratio на сервере не существовало и строка оставалась сырой.
  kd_ratio:
    display-name: '&eК/Д'
    template: '&7счёт побед и поражений &e⚔ &f%lovetweaks_kd%'
    lore:
      - '&7Соотношение убийств игроков к смертям'
    category: combat

  duel_honor:
    display-name: '&cЧесть дуэлей'
    template: '&7честь на дуэлях &c⚔ &f%loveduels_honor%'
    lore:
      - '&7Ваш рейтинг чести в дуэлях'
    category: combat

  duels:
    display-name: '&cДуэли'
    lore:
      - '&7Ваши результаты в дуэлях'
      - '&8Shift+ЛКМ — сменить формат'
    category: combat
    variants:
      - name: 'Победы'
        template: '&7выиграл &c⚔ &f%loveduels_wins% &7дуэлей'
      - name: 'Винрейт'
        template: '&7берёт верх в &c⚔ &f%loveduels_winrate% &7дуэлей'
      - name: 'Серия'
        template: '&7не знает поражений &c⚔ &f%loveduels_streak% &7дуэлей подряд'

  duel_royal:
    display-name: '&cКоролевские дуэли'
    template: '&7вышел победителем &c⚔ &f%loveduels_royal_wins% &7раз в королевских'
    lore:
      - '&7Победы в королевских дуэлях'
    category: combat

  # ── Кланы ──
  clan_tag:
    display-name: '&6Тег клана'
    template: '&7знамя союза &6⚑ &f%clans_colored_tag%'
    lore:
      - '&7Тег вашего клана'
    category: clans
    requirement:
      placeholder: '%clans_in_clan%'
      equals: 'true'
      reason: '&7Нужно состоять в клане'

  clan_name:
    display-name: '&6Клан'
    template: '&7служит в &6%clans_name% &8[ранг &e%clans_rank_display%&e◆&8]'
    lore:
      - '&7Полное название вашего клана'
    category: clans
    requirement:
      placeholder: '%clans_in_clan%'
      equals: 'true'
      reason: '&7Нужно состоять в клане'

  clan_level:
    display-name: '&6Уровень клана'
    template: '&7союз достиг &6◆ &f%clans_level% &7уровня'
    lore:
      - '&7Уровень вашего клана'
    category: clans
    requirement:
      placeholder: '%clans_in_clan%'
      equals: 'true'
      reason: '&7Нужно состоять в клане'

  clan_role:
    display-name: '&6Роль в клане'
    template: '&7ранг в союзе &e%clans_rank_display% &e◆'
    lore:
      - '&7Ваша должность в клане'
    category: clans
    requirement:
      placeholder: '%clans_in_clan%'
      equals: 'true'
      reason: '&7Нужно состоять в клане'

  clan_influence:
    display-name: '&6Влияние клана'
    template: '&eкуёт влияние &6★ &f%clans_influence% &7для союза'
    lore:
      - '&7Очки влияния вашего клана'
    category: clans
    requirement:
      placeholder: '%clans_in_clan%'
      equals: 'true'
      reason: '&7Нужно состоять в клане'

  clan_territories:
    display-name: '&6Территории клана'
    template: '&7союз держит &6⚑ &f%clans_territories% &7земель'
    lore:
      - '&7Сколько территорий занимает клан'
    category: clans
    requirement:
      placeholder: '%clans_in_clan%'
      equals: 'true'
      reason: '&7Нужно состоять в клане'

  clan_members:
    display-name: '&6Участники клана'
    template: '&7в союзе &6⚑ &f%clans_members% &7бойцов'
    lore:
      - '&7Размер вашего клана'
    category: clans
    requirement:
      placeholder: '%clans_in_clan%'
      equals: 'true'
      reason: '&7Нужно состоять в клане'

  clan_spirit:
    display-name: '&6Дух клана'
    template: '&7дух союза &6◆ &f%clans_spirit_level% &7ур.'
    lore:
      - '&7Уровень духа вашего клана'
    category: clans
    requirement:
      placeholder: '%clans_in_clan%'
      equals: 'true'
      reason: '&7Нужно состоять в клане'

  # ── Охота ──
  hunt_rank:
    display-name: '&2Ранг охотника'
    template: '&7охотник ранга &2◆ &f%lovehunt_rank_stars% %lovehunt_rank%'
    lore:
      - '&7Ваш ранг в охоте за головами'
    category: hunt

  hunt_rating:
    display-name: '&2Рейтинг охотника'
    template: '&7слава охотника &2◆ &f%lovehunt_rating%'
    lore:
      - '&7Ваш рейтинг в охоте'
    category: hunt

  hunt_results:
    display-name: '&2Выполнено / провалено'
    template: '&7исполнил &a%lovehunt_completed% &7заказов, провалил &c%lovehunt_failed%'
    lore:
      - '&7Выполненные и проваленные заказы охоты'
    category: hunt

  hunt_mine:
    display-name: '&2Мои заказы'
    template: '&7выдал заказов &2◆ &f%lovehunt_mine_count%'
    lore:
      - '&7Заказы, которые создали вы'
    category: hunt

  hunt_active:
    display-name: '&2Активные заказы'
    template: '&7ждут охотников &2◆ &f%lovehunt_active_count% &7заказов'
    lore:
      - '&7Всего активных заказов на сервере'
    category: hunt

  # ── Ремесло ──
  brew_level:
    display-name: '&eУровень пивовара'
    lore:
      - '&7Ваш навык пивоварения'
      - '&8Shift+ЛКМ — сменить формат'
    category: craft
    variants:
      - name: 'Уровень'
        template: '&7мастер пивоварни &e◆ &f%lovebrew_level% &7уровня'
      - name: 'Опыт'
        template: '&7опыт пивовара &e◆ &f%lovebrew_exp%&7/&f%lovebrew_req_exp%'

  brew_stats:
    display-name: '&eСварено и продано'
    lore:
