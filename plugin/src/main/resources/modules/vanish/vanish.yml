# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
enabled: true
# Что перестаёт замечаться вокруг скрытого игрока (добавлено 2026-10-22). Режим игры не меняется:
# скрытый остаётся в своём обычном режиме, убирается только то, что видят и слышат другие.
# Мобы не берут скрытого в цель. Включайте true, только если скрытый должен быть «живой» целью.
mob-targeting: false
# Подбор предметов, стрел и опыта. По умолчанию запрещён: подобранный предмет исчезает с земли
# на глазах у остальных и выдаёт присутствие.
pickup: false
# Нажимные плиты, натяжные нити, вытаптывание пашни и яйца черепах. Запрещено по той же причине.
physical: false
# Вибрации для скалк-сенсоров и Хранителей (шаги, открытие сундуков, удары).
vibrations: false
# Звуки самого игрока (шаги, урон, плавание) глушатся флагом silent.
silent: true
# Полёт без смены режима, пока игрок скрыт. Включается и выключается в меню /vanish.
fly: true
# Строка в actionbar раз в 2 секунды, чтобы не забыть, что вы скрыты.
indicator: true
# Сообщения о смерти и достижениях скрытого игрока не рассылаются.
hide-messages: true
# Скрытый не попадает в счётчик и список игроков в списке серверов.
hide-from-list: true
# Ложное сообщение «вышел» при скрытии и «зашёл» при показе для тех, кто не видит скрытых.
fake-messages: false
gui:
  # Радиус фильтра «Рядом» в меню /vanish, в блоках. 64 — примерно четыре чанка: достаточно, чтобы
  # заметить игроков базы, и мало, чтобы список не превращался во весь мир.
  near-radius: 64
  # Если вы ещё не скрыты, прыжок к игроку сначала включает невидимость, чтобы не появиться перед ним.
  auto-vanish: true
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
