enabled: true
max-stones: 100
interact-radius: 5
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes:
  - SPECTATOR
  allowed-states: []
  denied-states: []
  required-states: []
messages:
  waystones:
    create: <gold>Создание путевого столба
    create-help: <gray>Столб появится на вашем месте. Выберите оформление и поворот.
      Прибытие — в двух блоках перед ним; его можно изменить в редакторе.
    name: <gold>Название
    style: <gold>Вариант оформления
    direction: <gold>Куда смотрит столб
    model: <gold>Ручной ID предмета (только при выборе ItemsAdder)
    models: <gold>Общий каталог моделей
    models-help: <gray>Добавьте модель один раз и выбирайте её у любых столбов. Название и предмет копируются при выборе. «Базовая настройка модели» изменяет все столбы с тем же предметом.
    model-item: <gold>Предмет ItemsAdder · namespace:id
    render-settings: <gold>Базовая настройка модели
    render-help: <gray>Параметры общие для всех столбов с этим предметом; размер одного столба задаётся в его «Оформлении». Высота и ширина задаются в блоках при масштабе 1. Подпись находится на высоте модели плюс отступ. Смещение X/Y/Z перемещает модель, область нажатия и подпись вместе. Центр X/Z задаётся относительно модели и поворачивается вместе со столбом; координаты вводятся через пробел. Для четырёх моделей VoidCore установите обновлённый пакет с преобразованием FIXED.
    render-offset: <gold>Общее смещение столба · X Y Z
    render-scale: <gold>Базовый масштаб модели · 0.05–4
    render-height: <gold>Высота модели при масштабе 1 · в блоках
    render-width: <gold>Ширина области нажатия при масштабе 1
    render-center: <gold>Центр относительно модели · X Z
    render-gap: <gold>Отступ подписи над верхом модели
    render-text-scale: <gold>Размер текста · 0.1–3
    render-text: <gold>Видимость подписи
    render-context: <gold>Преобразование предмета
    render-save: <green>Применить ко всем таким столбам
    render-invalid: <red>Проверьте числа. Смещение модели и центра — от -8 до 8; масштаб — 0.05–4; высота — 0.1–16; ширина — 0.1–8; отступ — от -2 до 8; размер текста — 0.1–3. Координаты вводятся через пробел.
    model-save: <green>Сохранить модель
    model-delete: <red>Удалить модель из каталога
    model-delete-help: <gray>Модель исчезнет из выбора. Установленные столбы сохранят прежний вид. Подтвердите удаление.
    place: <green>Установить столб
    delete: <red>Удаление столба
    delete-help: <gray>Столб исчезнет. Ссылки на него перестанут работать. Это действие
      нельзя отменить.
    route-title: <gold><from> → <to>
    route-help: <gray>«В обе стороны» создаёт такой же путь и обратно с теми же ценой и временем; «Только туда» — лишь из этого столба. Цена 0 — бесплатно, время в секундах.
    route-mode: <gold>Направление
    route-both: ↔ В обе стороны
    route-one: → Только туда
    route-invalid-cost: '<red>Цена: целое число от 0 до 1 000 000 000.'
    route-invalid-warmup: '<red>Подготовка: целое число секунд от 0 до 300.'
    route-invalid-cooldown: '<red>Перерыв: целое число секунд от 0 до 86 400.'
    route-invalid-permission: '<red>Право доступа: не длиннее 128 символов.'
    route-rollback: '<yellow>Не удалось сохранить обратный путь — изменения отменены.'
    dir-both: ↔ в обе стороны
    dir-out: → только отсюда
    dir-back: ← только сюда
    dir-none: не связан
    other-world: другой мир
    size: <gold>Размер столба
    size-custom: <gold>Свой размер · 0.25–5 (если выбрано «Свой…»)
    size-custom-option: Свой…
    size-invalid: '<red>Размер: число от 0.25 до 5, например 2 или 2.5.'
    link-all: <gold>Связать со всеми в мире
    link-all-help: '<gray>Будут созданы недостающие двусторонние направления (столбов: <count>). Существующие настройки не меняются.'
    link-all-confirm: <green>Связать
    next-step: '<gray>Столб создан. Следующий шаг: <white>«Направления»<gray> — выберите, куда он ведёт.'
    cost: <gold>Цена в монетах LoveEconomy (0 — бесплатно)
    warmup: <gold>Подготовка перед переходом, 0–300 секунд
    cooldown: <gold>Перерыв после успешного перехода, 0–86400 секунд
    permission: <gold>Право доступа (пусто — всем)
    unlink: <red>Отключить направление
    usage: '<yellow>/waystone <gray>— открыть ближайший столб; для администратора:
      create, edit [номер] или models'
    invalid: <red>Проверьте название, цену и время. Максимум 32 направления.
    blocked: '<red>Сейчас путешествовать нельзя: проверьте бой, авторизацию, раненое
      состояние или пассажиров.'
    destination-unavailable: "<red>Мир назначения сейчас не загружен."
    not-found: <red>Столб или маршрут больше не существует.
    nearby: <gray>Подойдите к путевому столбу и нажмите ПКМ.
    busy: <gray>Дождитесь текущего перехода или загрузки данных.
    limit: <red>Достигнут лимит путевых столбов.
    overlap: '<red>Слишком близко к другому столбу: отступите хотя бы на два блока.'
    model-unavailable: <red>Предмет ItemsAdder не найден или ItemsAdder не установлен.
    changed: <yellow>Настройки изменились. Откройте редактор заново.
    cooling: <gray>После предыдущего перехода ещё действует задержка.
    no-funds: <red>Не хватает монет или служба экономики недоступна.
    cancel-button: <red>[Отменить]
    countdown: <gold>Переход через <seconds> сек.
    preparing: <gold>Подготовка к переходу… <gray>Стойте на месте. Движение или урон
      отменит переход.
    arrived: <gold>Вы прибыли к месту назначения.
    cancelled: <gray>Переход отменён. Плата за неудачный переход возвращается.
    appearance: <gold>Оформление столба
    appearance-help: <gray>Измените название или вид. Положение и маршруты сохранятся.
max-concurrent: 8
render:
  # 2026-10-27: множители размера одного столба в диалогах создания и оформления; кроме них
  # доступен пункт «Свой…» (0.25–5). Итоговый размер вместе с базовым масштабом модели
  # ограничен в 8 раз: больший столб выходит за пределы загруженных чанков.
  size-presets: [0.5, 1, 1.5, 2, 2.5, 3]
  enabled: true
  label-text: '<gold><name> <gray>· ПКМ'
# 2026-10-27: значения новой формы направления. Цена 0 сохраняет прежнее поведение (бесплатно);
# задайте цену за 100 блоков и цену между мирами, если переходы должны стоить монет.
route-defaults:
  cost-per-100-blocks: 0
  cross-world-cost: 0
  warmup: 3
  cooldown: 30
