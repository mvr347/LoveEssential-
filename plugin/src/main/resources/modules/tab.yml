# Настройки модуля. Тексты находятся в lang.yml.
enabled: true
refresh-ticks: 10
respect-other-scoreboards: true
sorting-enabled: true
sorting:
- group
- name
name-enabled: true
groups:
  admin:
    permission: loveessential.group.admin
    priority: 0
    name-key: tab.groups.admin.name
    prefix-key: tab.groups.admin.prefix
    suffix-key: tab.suffix
  knight:
    permission: loveessential.group.knight
    priority: 20
    name-key: tab.groups.knight.name
    prefix-key: tab.groups.knight.prefix
    suffix-key: tab.suffix
nametag:
  enabled: true
  collision: false
  visible: true
header-footer:
  enabled: true
  header-key: tab.header
  footer-key: tab.footer
  profiles: {}
playerlist-objective:
  enabled: true
  value: ping
  title-key: tab.objective
below-name:
  enabled: false
  value: health
  title-key: tab.health
sidebar:
  enabled: false
  title-key: tab.sidebar.title
  line-keys:
  - tab.sidebar.player
  - tab.sidebar.clan
  - tab.sidebar.reputation
  - tab.sidebar.online
bossbars:
  kingdom:
    enabled: false
    text-key: tab.bossbar
    progress: 1.0
    color: YELLOW
    overlay: PROGRESS

# Пустые списки не ограничивают. Запрет важнее разрешения; required — все состояния, allowed — любое.
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
