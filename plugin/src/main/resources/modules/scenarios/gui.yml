texts:
  scenarios:
    entry: <gold><id>
    rate-limit: <yellow>Лимит запусков сценариев за минуту достигнут. Возможна циклическая цепочка событий.
    reset: <yellow>Сбросить свой журнал
    reset-confirm: <yellow>Разрешить этому сценарию выполниться для вас заново? Награды и списания могут повториться.
    title: <gold>Сценарии событий
    help: <gray>Сценарий — условие и последовательность действий. Новые сценарии выключены до настройки.
    create: <gold>Новый сценарий
    id: <gold>ID сценария
    edit: <gold>Редактор сценария
    edit-help: <gray>Первый вход фиксируется до авторизации. Действия выполняются после LoveAuth. Пустой мир или право снимают соответствующее
      ограничение.
    enabled: <gold>Включён
    trigger: <gold>Событие запуска
    once: <gold>Один раз для каждого игрока
    steps: <gold>Последовательность действий
    steps-help: <gray>Каждый шаг имеет задержку и действие. Откройте шаг для изменения или удаления.
    step-entry: <gold><index>. <white><type>
    add-step: <green>Добавить шаг
    remove-step: <red>Удалить шаг
    move-up: <gold>Переместить выше
    step: <gold>Шаг сценария
    step-help: <gray>Для сообщения введите MiniMessage; для диалога или мира — ID; для звука — Bukkit Sound; для монет — количество; для команды
      — строку без /. Команда исполняется с правами игрока и должна быть разрешена в списке actions.
    action: <gold>Действие
    argument: <gold>Текст, ID или параметр действия
    delay: <gold>Задержка в тиках (20 = 1 секунда)
    run: <green>Запустить для себя
    delete-confirm: <yellow>Удалить сценарий? Его журнал выполнения останется в базе.
    disabled: <red>Сценарий выключен.
    limit: <red>Достигнут лимит сценариев или шагов.
    usage: <yellow>/le scenario [list|create|edit|run|reset|delete] [ID]
