enabled: true
min-length: 3
max-length: 24
prevent-impersonation: true
default-color: ''
apply-display-name: true
apply-to-tab: true
apply-to-messages: true
gradients:
  kingdom: ['#ffcc66', '#fff2cc']
  sunset: ['#ff6699', '#ffaa33', '#ffdd77']
  ocean: ['#3388ff', '#55ffff']
  forest: ['#228844', '#bbff88']

# Пустые списки не ограничивают. Запрет важнее разрешения; required — все состояния, allowed — любое.
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []

# Тексты кнопок задаются ключами lang.yml; оформление не меняет права и обработчики.
gui:
  menus: {}
