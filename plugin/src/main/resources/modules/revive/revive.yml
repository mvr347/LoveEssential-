# Тексты находятся рядом с настройками; MiniMessage и подстановки поддерживаются.
# Модуль «Раненые» (добавлен 2026-10-22): смертельный удар не убивает, а роняет игрока на землю, где
# его могут поднять, унести или обыскать. Значения по умолчанию повторяют ReviveMe, чтобы переход
# не менял привычек игроков. По умолчанию модуль выключен: он меняет саму смерть, и включать его
# надо сознательно, а при установленном ReviveMe — только вместо него, не вместе.
enabled: false
access:
  allowed-worlds: []
  denied-worlds: []
  allowed-gamemodes: []
  denied-gamemodes: []
  allowed-states: []
  denied-states: []
  required-states: []
# Сколько секунд раненый ждёт помощи. 75 с хватает добежать с соседнего участка, но не даёт
# отлежаться, пока бой уже закончился.
death-delay: 75
# Что делать, когда время вышло: kill — игрок умирает, revive — встаёт сам.
death-count-action: kill
# Сколько секунд сосед должен непрерывно сидеть рядом, чтобы поднять. 10 с — достаточно, чтобы
# подъём нельзя было сделать посреди боя, но не мучительно долго.
reliving-count: 10
# Подъём начинается с расстояния min и не прерывается, пока помогающий не отошёл дальше max:
# разный порог убирает дрожание, когда игроки стоят на границе.
reliving-distance-min: 1.3
reliving-distance-max: 5.0
# Первые секунды раненый неуязвим: иначе добивающий удар следующего тика убил бы его раньше, чем
# он успеет позвать на помощь. Потом урон снова проходит.
invulnerability-delay: 15
# Здоровье в состоянии «ранен» и после подъёма (в половинках сердца).
downed-health: 1.0
revived-health: 4.0
# Защита от повторного урона после успешного оживления; 0 выключает.
revived-protection-seconds: 2.0
# При установленном DeluxeCombat инвентарь смерти определяет он и правила мира.
# keep-inventory этого модуля тогда не переопределяет решение обработчика трупов.
deluxecombat-inventory: true
# Дополнительная область ПКМ: у лежащего смещается от ног к середине тела.
# Отрицательное смещение позволяет учесть направление конкретного ресурспака.
interaction:
  forward-offset: 0.65
  width: 1.6
  height: 0.9
# Сдаться: удерживать присед suicide-count секунд, но не раньше, чем через suicide-delay после падения.
suicide-count: 5
suicide-delay: 5
# Множитель скорости ползком (1.0 — как обычно).
crawl-speed: 0.25
# 2026-10-25: поза раненого для остальных игроков. SLEEPING — человек лежит плашмя, как после /lay;
# SWIMMING — ванильное ползание. Собственный клиент также остаётся ползком:
# для этого ему отправляется невидимый потолок; реальные блоки мира не меняются.
pose: SLEEPING
# 2026-10-25: пока кто-то поднимает раненого, таймер смерти стоит. Иначе игрок, которого уже
# поднимают, мог умереть за секунду до конца подъёма, и помощь теряла смысл.
revive-pause-timer: true
# 2026-10-25: звуки в формате «название громкость высота»; название — ключ игры (block.note_block.chime)
# или константа Bukkit (BLOCK_NOTE_BLOCK_CHIME). Пустая строка выключает звук. tick и giveup-tick
# каждую секунду повышают высоту по мере прогресса, чтобы конец подъёма или сдачи слышался.
# Все выключаются разом через display.sounds.
sounds:
  down: entity.player.hurt 1.0 0.6
  start: block.note_block.chime 1.0 1.2
  tick: block.note_block.pling 0.6 0.8
  stop: block.note_block.bass 1.0 0.7
  revived: entity.player.levelup 1.0 1.0
  revived-extra: block.beacon.activate 0.7 1.4
  pickup: entity.item.pickup 1.0 0.8
  drop: block.wool.place 1.0 0.8
  giveup-tick: block.note_block.hat 0.8 0.9
# Если в руках тотем бессмертия, сначала срабатывает он, а раненым игрок становится только потом.
totem-first: true
# Виды урона, после которых игрок умирает сразу (упасть в бездну и подняться нельзя).
instant-kill-causes:
- VOID
- KILL
- SUICIDE
- WORLD_BORDER
# Если больше 0, игрок падает только когда в этом радиусе есть кому его поднять; иначе умирает сразу.
nearby-check-range: 0
# Сколько раз за жизнь игрок может упасть; 0 — без ограничения.
max-downs-per-life: 0
# Что раненому нельзя делать. Допустимо: attack, blocks, items, pickup, drop, craft, glide,
# inventory, sprint, commands.
blocked-actions:
- attack
- blocks
- items
- pickup
- drop
- craft
- glide
- inventory
- sprint
- commands
# Пасхалки подъёма (добавлено 2026-10-30): фраза после третьего подъёма за одну жизнь и фраза, если вас
# поднял тот, кого вы сами поднимали. Только слова и запись в «Книге тайн», на игру не влияют. Список
# «кого я поднимал» живёт в памяти и обнуляется при перезапуске сервера: для шутки хранить его в базе
# не стоит.
easter-eggs: true
# Предметы подъёма (добавлено 2026-10-30): ключи данных предмета, по которым модуль узнаёт чужой
# предмет, поднимающий раненого, — по умолчанию «Эликсир подъёма» LoveBrew. Раненый может его выпить,
# хотя предметы ему запрещены (blocked-actions: items), а ПКМ помощника с ним по телу не поднимает на
# руки и не обыскивает — флакон обрабатывает сам LoveBrew. Пустой список выключает обе уступки.
revive-items:
- lovebrewing:revive_potion
# Команды раненого: * запрещает все, кроме перечисленных в allowed-commands.
blocked-commands:
- '*'
allowed-commands:
- revive
- rv
- msg
- reply
# Мобы теряют раненого из виду: иначе его добьют ещё до того, как придёт помощь.
mobs-ignore: true
# Выход из игры раненым: true — игрок умирает (вещи выпадают), false — просто встаёт при входе.
disconnect-kill: true
# Сохранять ли инвентарь, если раненый умер от таймера или сдачи.
keep-inventory: false
# Показывать ли сообщение о смерти раненого.
death-message: true
carry:
  # ПКМ по раненому берёт его на руки (как в ReviveMe), присед несущего опускает. ПКМ с Shift
  # открывает вещи раненого.
  enabled: true
  # 2026-10-25: старый способ — удар по раненому, выключен: удар по лежащему часто гасился чужой
  # защитой, и подъём «не работал».
  left-click: false
  # 2026-10-25: доля потери скорости несущего. 15% — заметно, что ноша тяжёлая, но убежать от
  # боя с ней всё ещё можно; 0 выключает замедление.
  slow: 0.15
  # Урон по несущему роняет раненого.
  drop-on-damage: true
  # Таймер смерти стоит, пока раненого несут.
  pause-timer: true
steal:
  # Присед + правый клик открывает инвентарь раненого. Права: loveessential.revive.robber и
  # loveessential.revive.stealable (у жертвы).
  enabled: true
price:
  # none, money, level или item. Платит тот, кто поднимает; оплата снимается в начале подъёма и
  # возвращается, если подъём прервали. Право loveessential.revive.free освобождает от платы.
  type: none
  amount: 0
  material: GOLDEN_APPLE
  refund-on-stop: true
restrictions:
  # Нельзя поднимать, пока сам помогающий в бою.
  deny-in-combat: false
  # Поднимать могут только соклановцы.
  clan-only: false
  # Поднимать в чужом привате можно только с правом доступа к нему.
  respect-claims: false
# Пауза между началами подъёма для одного помогающего, секунды.
start-cooldown: 0
# Скорость подъёма по правам loveessential.revive.speed.<имя>: множитель к скорости работы.
ranks: {}
display:
  bossbar: true
  particles: true
  sounds: true
  # Подсказка «присядьте рядом» для игроков вокруг раненого.
  hint-radius: 8
# Действия по событиям. Роли: downed — раненый, actor — помогающий/несущий/грабитель.
# Пример: events: {revive: {downed: [{type: potion, effect: regeneration, seconds: 5, amplifier: 1}]}}
events: {}
