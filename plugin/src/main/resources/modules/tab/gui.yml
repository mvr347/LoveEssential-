texts:
  tab-editor:
    title: <gold>Редактор TAB
    header: <gold>Строки шапки
    footer: <gold>Строки подвала
    groups: <gold>Группы игроков
    placeholders: <gold>Плейсхолдеры
    sorting: <gold>Порядок игроков
    nametag: <gold>Имена над игроками
    sidebar: <gold>Строки боковой панели TAB
    advanced: <gold>Все параметры модуля
    lines-title: <gold>Строки TAB
    lines-help: <gray>Каждая строка редактируется отдельно. Доступны MiniMessage, %PAPI% и <placeholder:id>. Пустая строка создаёт отступ.
    line: <gold>Строка <white><index>
    add-line: <gold>Добавить строку
    line-title: <gold>Редактирование строки
    text: <gold>Текст с цветами и плейсхолдерами
    up: <gold>Поднять
    down: <gold>Опустить
    add-group: <gold>Создать группу
    add-placeholder: <gold>Добавить плейсхолдер
    groups-help: <gray>Группа с меньшим приоритетом побеждает. Пустые списки игроков и миров не ограничивают группу.
    group-title: <gold>Настройка группы
    id: <gold>Идентификатор
    permission: <gold>Дополнительное право (пусто — всем)
    priority: <gold>Приоритет (меньше — выше)
    name: <gold>Формат имени
    prefix: <gold>Префикс
    suffix: <gold>Суффикс
    players: <gold>Имена или UUID игроков через запятую
    worlds: <gold>Миры через запятую
    placeholder-title: <gold>Настройка плейсхолдера
    placeholder-help: <gray>Используйте в строках как <placeholder:id>. Значение может содержать цвет, встроенные теги и %PAPI%.
    enabled: <gold>Включено
    visible: <gold>Видно имя
    collision: <gold>Столкновения
    nametag-help: <gray>Показ имён и столкновения игроков. Группы задают префикс, имя и суффикс; эти переключатели управляют самим отображением.
    sorting-help: '<gray>Критерии проверяются по порядку: group, name, number:%плейсхолдер% или number-desc:%плейсхолдер%. Цвета здесь не используются.'
    sort-rule: <gold>Критерий сортировки
