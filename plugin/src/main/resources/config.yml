# Общие настройки. Конфигурация модулей: modules/<модуль>/<модуль>.yml и gui.yml.
config-version: 5
storage:
  profile-cache-mib: 16
  write-queue: 256
  # 2026-10-21: сколько копий базы хранить в backups/. Каждая копия — полный VACUUM INTO, то есть
  # размер всей базы; без ротации папка росла бесконечно. 10 копий — запас на неделю ручных
  # бэкапов при ежедневном запуске. Самые старые удаляются после успешного создания новой.
  backup-keep: 10
