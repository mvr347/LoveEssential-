config-version: 2
modules:
  npc: true
  tab: true
  home: true
  spawn: true
  teleport: true
  vanish: true
  afk: true
  skin: true
  sitride: true
  nightskip: true
  portal: true
  hologram: true
  traces: false
  joinquit: true
  motd: true
storage:
  write-queue: 256
home:
  default-limit: 3
afk:
  timeout-seconds: 300
  kick-after-seconds: 0
night-skip:
  max-multiplier: 30
npc:
  allowed-types: [MANNEQUIN, VILLAGER, WANDERING_TRADER, ARMOR_STAND, ZOMBIE, SKELETON, CAT, WOLF, IRON_GOLEM, ALLAY]
  max-definitions: 1000
  max-active: 200
  max-route-points: 128
  pathfinding:
    threads: 2
    radius: 16
    max-nodes: 4096
    plans-per-tick: 1
actions:
  max-economy-amount: 100000
  allowed-player-commands: [contracts, pcontract, suffixes, shops, trade, activities, duels, hunt, brew, spawn, home]
tab:
  # native | tab. The tab engine requires TAB and PlaceholderAPI.
  engine: native
  refresh-ticks: 10
  respect-other-scoreboards: true
  sorting-enabled: true
  sorting: [group, name]
  name-enabled: true
  groups:
    admin:
      permission: loveessential.group.admin
      priority: 0
      name-key: tab.groups.admin.name
      prefix-key: tab.groups.admin.prefix
      suffix-key: tab.suffix
    knight:
      permission: loveessential.group.knight
      priority: 20
      name-key: tab.groups.knight.name
      prefix-key: tab.groups.knight.prefix
      suffix-key: tab.suffix
  nametag:
    enabled: true
    collision: false
    visible: true
  header-footer:
    enabled: true
    header-key: tab.header
    footer-key: tab.footer
    profiles: {}
  playerlist-objective:
    enabled: true
    value: ping
    title-key: tab.objective
  below-name:
    enabled: false
    value: health
    title-key: tab.health
  sidebar:
    enabled: false
    title-key: tab.sidebar.title
    line-keys: [tab.sidebar.player, tab.sidebar.clan, tab.sidebar.reputation, tab.sidebar.online]
  bossbars:
    kingdom:
      enabled: false
      text-key: tab.bossbar
      progress: 1.0
      color: YELLOW
      overlay: PROGRESS
  # Complete TAB configuration passthrough, exported explicitly by /le tab export.
  # Every TAB setting can be added here. @lang(key) resolves through our PAPI expansion.
  external:
    config:
      header-footer:
        enabled: true
        designs:
          default:
            header: ['@lang(tab.header)']
            footer: ['@lang(tab.footer)']
      tablist-name-formatting:
        enabled: true
        disable-condition: '%loveessential_authenticated%=false'
      scoreboard-teams:
        enabled: true
        enable-collision: false
        invisible-nametags: false
        sorting-types: ['GROUPS:admin,knight,default', 'PLACEHOLDER_A_TO_Z:%player%']
        case-sensitive-sorting: false
        can-see-friendly-invisibles: false
      playerlist-objective:
        enabled: true
        value: '%ping%'
        fancy-value: '@lang(tab.ping)'
        title: '@lang(tab.objective)'
        render-type: INTEGER
      belowname-objective:
        enabled: false
        value: '%health%'
        fancy-value: '%health%'
        fancy-value-default: ''
        title: '@lang(tab.health)'
        view-distance: 10
      bossbar:
        enabled: false
        remember-toggle-choice: false
        bars:
          kingdom:
            style: PROGRESS
            color: YELLOW
            progress: '100'
            text: '@lang(tab.bossbar)'
      scoreboard:
        enabled: false
        remember-toggle-choice: false
        scoreboards:
          kingdom:
            title: '@lang(tab.sidebar.title)'
            lines: ['@lang(tab.sidebar.player)', '@lang(tab.sidebar.clan)', '@lang(tab.sidebar.reputation)', '@lang(tab.sidebar.online)']
      layout:
        enabled: false
        direction: COLUMNS
        enable-remaining-players-text: true
        remaining-players-text: '@lang(tab.layout.remaining)'
        empty-slot-ping-value: 1000
        layouts:
          default:
            slot-count: 80
            fixed-slots: ['1|@lang(tab.layout.title)', '2|@lang(tab.sidebar.player)', '3|@lang(tab.sidebar.online)']
            groups:
              players:
                slots: [21-80]
      ping-spoof:
        enabled: false
        value: 0
      global-playerlist:
        enabled: false
        display-others-as-spectators: false
        display-vanished-players-as-spectators: false
        isolate-unlisted-servers: true
        update-latency: false
        server-groups: {}
      placeholder-refresh-intervals:
        default-refresh-interval: 500
        '%loveessential_authenticated%': 200
        '%loveessential_vanished%': 200
      assign-groups-by-permissions: true
      primary-group-finding-list: [admin, knight, default]
      permission-refresh-interval: 1000
      mysql:
        enabled: false
    groups:
      _DEFAULT_:
        tabprefix: '@lang(tab.prefix)'
        tagprefix: '@lang(tab.prefix)'
        customtabname: '@lang(tab.name)'
        tabsuffix: '@lang(tab.suffix)'
        tagsuffix: '@lang(tab.suffix)'
      admin:
        tabprefix: '@lang(tab.groups.admin.prefix)'
        tagprefix: '@lang(tab.groups.admin.prefix)'
      knight:
        tabprefix: '@lang(tab.groups.knight.prefix)'
        tagprefix: '@lang(tab.groups.knight.prefix)'
    animations: {}
