help:
  main:
  - <gold>LoveEssential
  - <gray>/npc wizard — мастер NPC
  - <gray>/npc edit <id> — редактор
  - <gray>/le module [имя] [enable|disable|info|reload]
  - <gray>/le integrations — состояние сервисов Love
  - <gray>/le tab export — экспорт настроек в TAB
  - <gray>/le reload — перезагрузка
  - <gray>/le backup — резервная копия SQLite
  npc:
  - <gold>Редактор NPC
  - <gray>/npc wizard; /npc edit <id>
  - <gray>/npc set <параметр> <значение>; /npc here
  - <gray>/npc path add|mode|point|remove|move|record|tool|show|undo|redo
  - <gray>/npc dialog node|answer|start|answer-condition|answer-actions
  - <gray>/npc save; /npc publish; /npc preview
  - <gray>/npc delete <id> confirm
  tab: '<gray>Выберите tab.engine: tab, затем /le tab export и /le reload. TAB и PlaceholderAPI обязательны.'
