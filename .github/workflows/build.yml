name: Build and test
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: LoveEssential-Java25
          path: plugin/target/LoveEssential-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: LoveDeluxeCombatAddon-Java25
          path: addons/deluxecombat/target/LoveDeluxeCombatAddon-*.jar
